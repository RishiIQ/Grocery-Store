<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article — FreshCart Journal</title>
  <link rel="icon" type="image/png" href="assets/images/grossary-logo.png">
  <script>
  (function() {
    // Instant Theme Init
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    // Instant Direction Init
    const savedDir = localStorage.getItem('dir') || 'ltr';
    document.documentElement.setAttribute('dir', savedDir);
  })();
</script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'nixon-red': '#E31837',
          }
        }
      }
    }
  </script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* ============================================
       NIXON-STYLE ARTICLE DETAIL
       ============================================ */
    
    /* Article hero with gradient */
    .article-hero {
      position: relative;
      overflow: hidden;
      background: #000000;
    }
    
    .article-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }
    
    /* Hero glow orbs */
    .hero-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      will-change: transform, opacity;
    }
    
    @keyframes orbFloatSlow {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      33% { transform: translate(50px, -30px) scale(1.1); opacity: 0.5; }
      66% { transform: translate(-30px, 40px) scale(0.9); opacity: 0.4; }
    }
    
    .orb-article-1 {
      width: 500px;
      height: 500px;
      background: rgba(227, 24, 55, 0.06);
      top: -150px;
      right: -150px;
      animation: orbFloatSlow 10s ease-in-out infinite;
    }
    
    .orb-article-2 {
      width: 350px;
      height: 350px;
      background: rgba(227, 24, 55, 0.04);
      bottom: -100px;
      left: -100px;
      animation: orbFloatSlow 12s ease-in-out infinite reverse;
    }
    
    /* Nixon typography */
    .nixon-heading {
      font-family: 'Arial Black', 'Impact', sans-serif;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 0.95;
    }
    
    .nixon-subheading {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      font-weight: 700;
    }
    
    .nixon-body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 1.05rem;
      line-height: 1.9;
      color: #333333;
    }
    
    .dark .nixon-body {
      color: #CCCCCC;
    }
    
    /* Article content styling */
    .article-content {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 1.05rem;
      line-height: 1.9;
      color: #333333;
    }
    
    .dark .article-content {
      color: #CCCCCC;
    }
    
    .article-content h2 {
      font-family: 'Arial Black', 'Impact', sans-serif;
      text-transform: uppercase;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #000000;
      margin-top: 2.5rem;
      margin-bottom: 1rem;
    }
    
    .dark .article-content h2 {
      color: #FFFFFF;
    }
    
    .article-content h3 {
      font-family: 'Arial Black', 'Impact', sans-serif;
      text-transform: uppercase;
      font-size: 1.3rem;
      letter-spacing: -0.02em;
      color: #000000;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
    }
    
    .dark .article-content h3 {
      color: #FFFFFF;
    }
    
    .article-content p {
      margin-bottom: 1.25rem;
    }
    
    .article-content .pull-quote {
      font-family: 'Arial Black', 'Impact', sans-serif;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1.2;
      color: #000000;
      border-left: 4px solid #E31837;
      padding-left: 1.5rem;
      margin: 2rem 0;
    }
    
    .dark .article-content .pull-quote {
      color: #FFFFFF;
    }
    
    .article-content ul, 
    .article-content ol {
      margin: 1rem 0 1.5rem 1.5rem;
    }
    
    .article-content li {
      margin-bottom: 0.5rem;
    }
    
    .article-content .highlight-box {
      background: #F5F5F5;
      border: 1px solid #E5E5E5;
      padding: 2rem;
      margin: 2rem 0;
    }
    
    .dark .article-content .highlight-box {
      background: #1A1A1A;
      border-color: #333333;
    }
    
    .article-content .highlight-box h4 {
      font-family: 'Arial Black', 'Impact', sans-serif;
      text-transform: uppercase;
      font-size: 1rem;
      color: #E31837;
      margin-bottom: 0.5rem;
    }
    
    /* Image with caption */
    .article-image-wrap {
      position: relative;
      overflow: hidden;
      margin: 2rem 0;
    }
    
    .article-image-wrap img {
      width: 100%;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .article-image-wrap:hover img {
      transform: scale(1.02);
    }
    
    .article-image-wrap .caption {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #8A8A8A;
      padding: 0.75rem 0 0;
      text-align: center;
      border-bottom: 1px solid #E5E5E5;
    }
    
    .dark .article-image-wrap .caption {
      border-color: #333333;
    }
    
    /* Meta tags */
    .meta-tag {
      display: inline-block;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #8A8A8A;
      padding: 4px 12px;
      border: 1px solid #E5E5E5;
      transition: all 0.3s ease;
    }
    
    .dark .meta-tag {
      border-color: #333333;
    }
    
    .meta-tag:hover {
      border-color: #E31837;
      color: #E31837;
    }
    
    /* Share buttons */
    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #000000;
      border: 1px solid #E5E5E5;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
    }
    
    .dark .share-btn {
      color: #FFFFFF;
      border-color: #333333;
    }
    
    .share-btn:hover {
      border-color: #E31837;
      color: #E31837;
      transform: translateY(-2px);
    }
    
    /* Navigation arrows */
    .nav-arrow {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #000000;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 12px 0;
    }
    
    .dark .nav-arrow {
      color: #FFFFFF;
    }
    
    .nav-arrow:hover {
      color: #E31837;
      gap: 16px;
    }
    
    .nav-arrow.prev:hover {
      gap: 16px;
    }
    
    /* Scroll progress bar */
    .scroll-progress {
      position: fixed;
      top: 70px;
      left: 0;
      height: 3px;
      background: #E31837;
      width: 0%;
      z-index: 100;
      transition: width 0.05s linear;
      box-shadow: 0 0 20px rgba(227, 24, 55, 0.3);
    }
    
    /* Reading time indicator */
    .reading-time {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #8A8A8A;
    }
    
    /* Author bio */
    .author-bio {
      background: #F5F5F5;
      border: 1px solid #E5E5E5;
      padding: 2rem;
      margin-top: 3rem;
    }
    
    .dark .author-bio {
      background: #1A1A1A;
      border-color: #333333;
    }
    
    .author-bio .avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #E31837;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Arial Black', 'Impact', sans-serif;
      font-size: 1.5rem;
      color: #FFFFFF;
    }
    
    /* Related articles */
    .related-card {
      border: 1px solid #E5E5E5;
      padding: 1.5rem;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      display: block;
    }
    
    .dark .related-card {
      border-color: #333333;
    }
    
    .related-card:hover {
      border-color: #E31837;
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
    }
    
    .dark .related-card:hover {
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }
    
    .related-card h4 {
      font-family: 'Arial Black', 'Impact', sans-serif;
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: -0.02em;
      color: #000000;
      transition: color 0.3s ease;
    }
    
    .dark .related-card h4 {
      color: #FFFFFF;
    }
    
    .related-card:hover h4 {
      color: #E31837;
    }
    
    /* Scroll reveal */
    .reveal-on-scroll {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .reveal-on-scroll.is-revealed {
      opacity: 1;
      transform: translateY(0);
    }
    
    .reveal-on-scroll.delay-1 { transition-delay: 0.1s; }
    .reveal-on-scroll.delay-2 { transition-delay: 0.2s; }
    .reveal-on-scroll.delay-3 { transition-delay: 0.3s; }
    
    /* Responsive */
    @media (max-width: 768px) {
      .article-content {
        font-size: 0.95rem;
      }
      .article-content h2 {
        font-size: 1.4rem;
      }
      .article-content .pull-quote {
        font-size: 1.2rem;
        padding-left: 1rem;
      }
      .author-bio {
        padding: 1.5rem;
      }
      .related-card {
        padding: 1rem;
      }
    }
    
    @media (max-width: 480px) {
      .article-content {
        font-size: 0.9rem;
      }
      .article-content h2 {
        font-size: 1.2rem;
      }
      .article-content .pull-quote {
        font-size: 1rem;
      }
    }
    
    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
      .reveal-on-scroll {
        opacity: 1 !important;
        transform: none !important;
      }
      .article-image-wrap:hover img {
        transform: none !important;
      }
    }
  </style>
</head>
<body>

  <script src="js/db.js"></script>
  <script src="js/layout.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const headerContainer = document.getElementById('articleHeader');
      const bodyContainer = document.getElementById('articleBody');
      const relatedContainer = document.getElementById('relatedArticles');
      
      if (!headerContainer || !bodyContainer || !window.FreshCartDB) return;

      // ==========================================
      // 1. READ SLUG FROM URL
      // ==========================================
      const urlParams = new URLSearchParams(window.location.search);
      const postSlug = urlParams.get('slug');

      const post = FreshCartDB.blogPosts.find(p => p.slug === postSlug);
      const allPosts = FreshCartDB.blogPosts;

      if (!post) {
        document.querySelector('#articleHero').innerHTML = `
          <div class="py-20 text-center space-y-6 max-w-4xl mx-auto px-4">
            <h1 class="nixon-heading text-4xl">Dispatch Not Found</h1>
            <p class="nixon-body text-[#8A8A8A]">The requested journal entry may have been archived or does not exist.</p>
            <a href="blog.html" class="inline-block px-8 py-4 bg-black text-white font-['Helvetica_Neue'] text-xs font-bold tracking-[0.15em] uppercase hover:bg-[#E31837] transition-all">
              Return to Journal →
            </a>
          </div>
        `;
        return;
      }

      // ==========================================
      // 2. RENDER ARTICLE HEADER
      // ==========================================
      headerContainer.innerHTML = `
        <div class="inline-flex items-center gap-3 px-4 py-2 border border-[#E5E5E5] dark:border-[#333333] text-[#E31837] text-xs font-bold tracking-[0.2em] uppercase">
          <span>${post.category}</span>
          <span class="text-[#8A8A8A]">•</span>
          <span class="text-[#8A8A8A]">${post.date}</span>
        </div>
        <h1 class="nixon-heading text-white text-4xl sm:text-5xl lg:text-6xl">${post.title}</h1>
        <div class="flex items-center justify-center gap-6">
          <span class="reading-time">📖 ${post.readTime || '4 Min Read'}</span>
        </div>
      `;

      // ==========================================
      // 3. RENDER ARTICLE BODY
      // ==========================================
      bodyContainer.innerHTML = `
        <!-- Featured Image -->
        <div class="article-image-wrap reveal-on-scroll">
          <img 
            src="${post.image}" 
            alt="${post.title}" 
            loading="lazy"
          >
          <div class="caption">Featured Image • ${post.category}</div>
        </div>

        <!-- Pull Quote / Excerpt -->
        <div class="pull-quote reveal-on-scroll delay-1">
          "${post.excerpt}"
        </div>

        <!-- Article Content -->
        <div class="reveal-on-scroll delay-2">
          <p>
            In modern metropolitan grocery distribution, maintaining strict thermal integrity from farm gate to consumer doorstep represents one of the most complex logistical challenges in supply chain engineering. Traditional wholesale pathways often suffer from multi-tiered transit delays, exposing perishable organic harvests to unmonitored thermal fluctuations.
          </p>
          
          <h2>The 15-Minute Micro-Fulfillment Paradigm</h2>
          <p>
            By decentralizing inventory into neighborhood micro-fulfillment outposts equipped with IoT telemetry sensors, operators eliminate long-haul transit bottlenecks. Electric delivery vans equipped with continuous BLE temperature logging ensure that items like artisanal sourdoughs, heritage dairy, and wild-caught seafood never deviate outside strict 2.4°C thresholds.
          </p>

          <div class="highlight-box">
            <h4>Key Insight</h4>
            <p class="!mb-0">
              Consumer demand is shifting toward absolute supply transparency and regenerative agricultural standards. Automated real-time telemetry protocols will form the mandatory backbone of all elite direct-to-table supermarket networks.
            </p>
          </div>

          <h3>IoT Sensor Deployment</h3>
          <p>
            Our proprietary hardware stack includes BLE-enabled temperature loggers with sub-0.1°C accuracy, GPS tracking modules, and automated cloud synchronization. Each sensor packet is encrypted end-to-end and verified through blockchain-adjacent consensus protocols.
          </p>

          <h3>Regenerative Agriculture Integration</h3>
          <p>
            Partnering with over 140 regenerative cooperatives, we've established direct farm-to-node supply channels that bypass traditional wholesale markets. This ensures farmers receive 40% higher margins while consumers get superior quality produce at competitive prices.
          </p>
        </div>
      `;

      // ==========================================
      // 4. RENDER RELATED ARTICLES
      // ==========================================
      const relatedPosts = allPosts
        .filter(p => p.slug !== postSlug)
        .slice(0, 3);

      relatedContainer.innerHTML = relatedPosts.map(p => `
        <a href="blog-detail.html?slug=${p.slug}" class="related-card reveal-on-scroll">
          <div class="text-xs font-bold tracking-[0.15em] uppercase text-[#E31837]">${p.category}</div>
          <h4 class="mt-2">${p.title}</h4>
          <div class="flex items-center justify-between mt-3">
            <span class="text-xs text-[#8A8A8A]">${p.date}</span>
            <span class="text-xs font-bold tracking-[0.1em] uppercase text-[#E31837]">Read →</span>
          </div>
        </a>
      `).join('');

      // ==========================================
      // 5. SCROLL PROGRESS BAR
      // ==========================================
      const progressBar = document.getElementById('scrollProgress');
      
      window.addEventListener('scroll', () => {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        const scrollHeight = document.documentElement.scrollHeight - window.innerHeight;
        const progress = (scrollTop / scrollHeight) * 100;
        progressBar.style.width = progress + '%';
      });

      // ==========================================
      // 6. SCROLL REVEAL
      // ==========================================
      const revealElements = document.querySelectorAll('.reveal-on-scroll');
      
      const revealObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-revealed');
          }
        });
      }, {
        threshold: 0.15,
        rootMargin: '0px 0px -50px 0px'
      });

      revealElements.forEach(el => revealObserver.observe(el));

      // ==========================================
      // 7. TOAST FUNCTION
      // ==========================================
      function showToast(message) {
        let container = document.getElementById('toast-container');
        if (!container) {
          container = document.createElement('div');
          container.id = 'toast-container';
          container.className = 'fixed bottom-8 right-8 z-50 flex flex-col gap-3 pointer-events-none';
          document.body.appendChild(container);
        }
        
        const toast = document.createElement('div');
        toast.className = 'pointer-events-auto bg-black text-white dark:bg-white dark:text-black px-6 py-4 text-sm font-bold tracking-[0.15em] uppercase shadow-2xl border border-[#333333] dark:border-[#E5E5E5] transform translate-y-4 opacity-0 transition-all duration-300';
        toast.textContent = message;
        container.appendChild(toast);
        
        requestAnimationFrame(() => {
          toast.classList.remove('translate-y-4', 'opacity-0');
        });
        
        setTimeout(() => {
          toast.classList.add('translate-y-4', 'opacity-0');
          setTimeout(() => toast.remove(), 400);
        }, 2500);
      }

      // Share button functionality
      document.querySelectorAll('.share-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          showToast('📋 Link copied to clipboard');
        });
      });

    });
  </script>

</body>
</html>
