<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/images/grossary-logo.png">
  <script>
  (function() {
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    const savedDir = localStorage.getItem('dir') || 'ltr';
    document.documentElement.setAttribute('dir', savedDir);
  })();
</script>
  <title>Shopping Bag & Modern Checkout — FreshCart Botanical Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'sage-accent': '#6A8071',
            'sage-dark': '#24302A',
            'cream-bg': '#F7F6F2',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .dashboard-heading {
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }
    .dashboard-subheading {
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      font-weight: 700;
      color: #6A8071;
    }
    .market-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 0px;
    }
    .dark .market-card {
      background: #18221D;
      border-color: #2D3E35;
    }
    .market-card:hover {
      border-color: #6A8071;
      box-shadow: 0 16px 48px rgba(106, 128, 113, 0.15);
    }
    .sage-btn {
      display: inline-block;
      padding: 16px 32px;
      background: #6A8071;
      color: #FFFFFF;
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      border: none;
      border-radius: 0px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      text-decoration: none;
      width: 100%;
    }
    .sage-btn:hover {
      background: #576B5D;
      transform: scale(1.02);
    }

    .pay-tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      border: 1px solid #E2E8F0;
      background: transparent;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .dark .pay-tab {
      border-color: #2D3E35;
      color: #94A3B8;
    }
    .pay-tab.active {
      background: #6A8071;
      color: #FFFFFF;
      border-color: #6A8071;
    }

    /* ==========================================================
       CREDIT CARD UI - 3D Card
       ========================================================== */
    .card-preview {
      perspective: 1000px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }
    
    .credit-card {
      width: 100%;
      aspect-ratio: 1.586/1;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      border-radius: 16px;
      padding: 24px 28px;
      position: relative;
      color: #FFFFFF;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      transform: rotateY(0deg) rotateX(0deg);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    
    .credit-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
      pointer-events: none;
    }
    
    .credit-card .card-chip {
      width: 40px;
      height: 30px;
      background: linear-gradient(135deg, #FFD700, #FFA500);
      border-radius: 4px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .credit-card .card-chip::after {
      content: '';
      width: 24px;
      height: 18px;
      border: 2px solid rgba(255, 215, 0, 0.3);
      border-radius: 2px;
      position: absolute;
    }
    
    .credit-card .card-brand {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: 0.1em;
      opacity: 0.8;
    }
    
    .credit-card .card-number {
      font-family: 'Courier New', monospace;
      font-size: 1.5rem;
      letter-spacing: 4px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
      min-height: 36px;
      display: flex;
      align-items: center;
    }
    
    .credit-card .card-number .placeholder {
      opacity: 0.3;
      font-size: 1.2rem;
      letter-spacing: 2px;
    }
    
    .credit-card .card-holder {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.8;
    }
    
    .credit-card .card-holder .value {
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 1;
      text-transform: uppercase;
      min-height: 24px;
      display: block;
      margin-top: 2px;
    }
    
    .credit-card .card-expiry {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0.8;
      text-align: right;
    }
    
    .credit-card .card-expiry .value {
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 1;
      min-height: 24px;
      display: block;
      margin-top: 2px;
    }
    
    .credit-card .card-cvv {
      position: absolute;
      right: 28px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.1);
      padding: 4px 12px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 1.2rem;
      letter-spacing: 2px;
      font-weight: 600;
      backdrop-filter: blur(4px);
      min-width: 50px;
      text-align: center;
    }
    
    .credit-card .card-cvv .placeholder {
      opacity: 0.3;
      font-size: 1rem;
    }
    
    .credit-card .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: auto;
    }
    
    /* Card color variants */
    .credit-card.visa {
      background: linear-gradient(135deg, #1a1a2e 0%, #1a3a5c 50%, #1a5276 100%);
    }
    
    .credit-card.mastercard {
      background: linear-gradient(135deg, #1a1a2e 0%, #2d1b2e 50%, #4a1a2e 100%);
    }
    
    .credit-card.amex {
      background: linear-gradient(135deg, #1a1a2e 0%, #1a2d2e 50%, #1a3a3a 100%);
    }
    
    /* ==========================================================
       UPI PHONE LAYOUT
       ========================================================== */
    .phone-frame {
      width: 280px;
      max-width: 100%;
      margin: 0 auto;
      background: #000000;
      border-radius: 36px;
      padding: 14px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    
    .dark .phone-frame {
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
    }
    
    .phone-screen {
      background: #FFFFFF;
      border-radius: 24px;
      overflow: hidden;
      aspect-ratio: 9/16;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
    }
    
    .dark .phone-screen {
      background: #1A1A1A;
    }
    
    .phone-screen .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.5rem;
      font-weight: 700;
      color: #94A3B8;
      margin-bottom: 16px;
    }
    
    .dark .phone-screen .status-bar {
      color: #64748B;
    }
    
    .phone-screen .app-header {
      text-align: center;
      margin-bottom: 16px;
    }
    
    .phone-screen .app-header .app-icon {
      width: 48px;
      height: 48px;
      background: #6A8071;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 8px;
      font-size: 1.4rem;
    }
    
    .phone-screen .app-header .app-name {
      font-size: 0.55rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #6A8071;
      letter-spacing: 0.1em;
    }
    
    .phone-screen .upi-amount {
      text-align: center;
      margin-bottom: 16px;
      padding: 12px;
      background: rgba(106, 128, 113, 0.06);
      border: 1px solid rgba(106, 128, 113, 0.15);
    }
    
    .phone-screen .upi-amount .label {
      font-size: 0.5rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #94A3B8;
      letter-spacing: 0.1em;
    }
    
    .phone-screen .upi-amount .amount {
      font-size: 1.4rem;
      font-weight: 800;
      color: #0F172A;
      margin-top: 2px;
    }
    
    .dark .phone-screen .upi-amount .amount {
      color: #FFFFFF;
    }
    
    .phone-screen .upi-id-display {
      padding: 12px;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      margin-bottom: 12px;
      text-align: center;
    }
    
    .dark .phone-screen .upi-id-display {
      border-color: #2D3E35;
    }
    
    .phone-screen .upi-id-display .label {
      font-size: 0.45rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #94A3B8;
      letter-spacing: 0.1em;
    }
    
    .phone-screen .upi-id-display .id {
      font-size: 0.8rem;
      font-weight: 600;
      color: #0F172A;
      margin-top: 2px;
      word-break: break-all;
    }
    
    .dark .phone-screen .upi-id-display .id {
      color: #FFFFFF;
    }
    
    .phone-screen .upi-id-display .id .placeholder {
      opacity: 0.3;
      font-size: 0.7rem;
    }
    
    .phone-screen .upi-keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: auto;
    }
    
    .phone-screen .upi-keypad button {
      padding: 12px 0;
      background: transparent;
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      color: #0F172A;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    
    .dark .phone-screen .upi-keypad button {
      color: #FFFFFF;
    }
    
    .phone-screen .upi-keypad button:hover {
      background: rgba(106, 128, 113, 0.08);
    }
    
    .phone-screen .upi-keypad button:active {
      background: rgba(106, 128, 113, 0.2);
      transform: scale(0.95);
    }
    
    .phone-screen .upi-keypad .backspace {
      color: #EF4444;
    }
    
    /* ==========================================================
       CONFIRMATION ANIMATION
       ========================================================== */
    @keyframes successPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    
    .success-animation {
      animation: successPulse 0.6s ease-in-out 3;
    }
    
    @keyframes cardShine {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    
    .card-shine {
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      background-size: 200% 100%;
      animation: cardShine 2s ease-in-out infinite;
    }

    .market-toast {
      background: #24302A;
      color: #FFFFFF;
      padding: 14px 24px;
      border-radius: 0px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      border-left: 4px solid #6A8071;
    }
  </style>
</head>
<body class="bg-cream-bg dark:bg-[#111814] text-slate-900 dark:text-slate-100 antialiased transition-colors duration-500">

  <!-- Shared DB and Layout Injector Scripts -->
  <script src="js/db.js"></script>
  <script src="js/layout.js"></script>

  <!-- Cart Bag Main Section -->
  <main class="pt-40 pb-36 px-4 sm:px-6 lg:px-12 max-w-7xl mx-auto space-y-12">
    <div class="border-b border-slate-200 dark:border-[#2D3E35] pb-8">
      <p class="dashboard-subheading">( Secure Telemetry Checkout )</p>
      <h1 class="dashboard-heading text-4xl sm:text-6xl mt-2">Shopping Bag.</h1>
    </div>

    <div id="cartContainer" class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
      <!-- Injected via JavaScript below -->
    </div>
  </main>

  <!-- Payment Modal Container -->
  <div id="paymentModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden p-4">
    <div class="market-card p-6 sm:p-8 max-w-5xl w-full mx-auto space-y-6 relative max-h-[95vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-200 dark:border-[#2D3E35] pb-4">
        <h3 class="dashboard-heading text-xl">Secure Payment Gateway</h3>
        <button onclick="closePaymentModal()" class="text-slate-400 hover:text-[#6A8071] font-bold text-lg cursor-pointer">✕</button>
      </div>

      <!-- Payment Method Tabs -->
      <div class="flex gap-2 flex-wrap">
        <button type="button" onclick="switchPayMethod('card')" id="tab-card" class="pay-tab active">Credit Card</button>
        <button type="button" onclick="switchPayMethod('upi')" id="tab-upi" class="pay-tab">UPI Transfer</button>
        <button type="button" onclick="switchPayMethod('cash')" id="tab-cash" class="pay-tab">Cash on Delivery</button>
      </div>

      <!-- Payment Content -->
      <div id="paymentContent" class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start">
        
        <!-- LEFT SIDE: Card Preview or Phone UI -->
        <div id="previewContainer" class="flex items-center justify-center min-h-[300px]">
          <!-- Injected by JavaScript -->
        </div>

        <!-- RIGHT SIDE: Form -->
        <div id="formContainer">
          <!-- Injected by JavaScript -->
        </div>

      </div>

      <button onclick="confirmPayment()" class="sage-btn mt-4">
        Authorize & Complete Order →
      </button>
    </div>
  </div>

  <!-- Dynamic Success Modal -->
  <div id="successModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-xl hidden p-4">
    <div class="success-card p-6 max-w-md w-full mx-4 text-center space-y-4 bg-white dark:bg-[#18221D] border border-slate-200 dark:border-[#2D3E35]">
      
      <div id="animationContainer"></div>

      <div class="space-y-1">
        <h3 id="modalStatusTitle" class="dashboard-heading text-lg">Processing Payment...</h3>
        <p id="modalStatusSubtitle" class="text-[0.6rem] uppercase tracking-[0.15em] text-slate-400">Communicating with financial nodes.</p>
      </div>

      <div id="thermalPrinterArea" class="hidden pt-2">
        <div class="printer-terminal">
          <div class="printer-slot"></div>
          <div id="receiptPaperContainer"></div>
        </div>
      </div>

      <button onclick="closeSuccessModal()" class="sage-btn mt-4 hidden" id="successCloseBtn">
        Continue Shopping →
      </button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('cartContainer');
      if (!container || !window.FreshCartDB) return;

      let calculatedGrandTotal = 0;
      let currentMethod = 'card';
      let activeCartSnapshot = [];
      let activeTotals = { subtotal: 0, shipping: 0, tax: 0 };

      // ==========================================================
      // CREDIT CARD LIVE PREVIEW
      // ==========================================================
      function renderCardPreview() {
        const previewContainer = document.getElementById('previewContainer');
        if (!previewContainer) return;

        const cardNumber = document.getElementById('cardNumber')?.value || '';
        const cardName = document.getElementById('cardName')?.value || '';
        const cardExpiry = document.getElementById('cardExpiry')?.value || '';
        const cardCvv = document.getElementById('cardCvv')?.value || '';

        // Format card number with spaces
        let formattedNumber = cardNumber.replace(/\s/g, '');
        if (formattedNumber.length > 0) {
          formattedNumber = formattedNumber.match(/.{1,4}/g)?.join(' ') || formattedNumber;
        }

        // Determine card type
        let cardType = 'visa';
        const firstDigit = cardNumber.replace(/\s/g, '')[0];
        if (firstDigit === '3') cardType = 'amex';
        else if (firstDigit === '5') cardType = 'mastercard';
        else if (firstDigit === '4') cardType = 'visa';

        previewContainer.innerHTML = `
          <div class="card-preview">
            <div class="credit-card ${cardType}">
              <div class="card-shine" style="position:absolute;inset:0;pointer-events:none;"></div>
              
              <!-- Card Top -->
              <div style="display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2;">
                <div class="card-chip"></div>
                <span class="card-brand">${cardType.toUpperCase()}</span>
              </div>

              <!-- Card Number -->
              <div class="card-number" style="position:relative;z-index:2;">
                ${formattedNumber || '<span class="placeholder">•••• •••• •••• ••••</span>'}
              </div>

              <!-- Card Bottom -->
              <div class="card-footer" style="position:relative;z-index:2;">
                <div class="card-holder">
                  CARD HOLDER
                  <span class="value">${cardName || 'JUSTIN MASON'}</span>
                </div>
                <div class="card-expiry">
                  EXPIRY
                  <span class="value">${cardExpiry || 'MM/YY'}</span>
                </div>
              </div>

              <!-- CVV (hidden, shown on hover) -->
              <div class="card-cvv" style="display:none;">
                ${cardCvv || '<span class="placeholder">•••</span>'}
              </div>
            </div>
            <p style="text-align:center;font-size:0.5rem;color:#94A3B8;margin-top:8px;text-transform:uppercase;letter-spacing:0.1em;">
              Hover card to reveal CVV
            </p>
          </div>
        `;

        // Add hover to show CVV
        const card = previewContainer.querySelector('.credit-card');
        if (card) {
          card.addEventListener('mouseenter', () => {
            const cvv = card.querySelector('.card-cvv');
            if (cvv) cvv.style.display = 'block';
          });
          card.addEventListener('mouseleave', () => {
            const cvv = card.querySelector('.card-cvv');
            if (cvv) cvv.style.display = 'none';
          });
        }
      }

      // ==========================================================
      // UPI PHONE LAYOUT
      // ==========================================================
      function renderUPIPreview() {
        const previewContainer = document.getElementById('previewContainer');
        if (!previewContainer) return;

        const upiId = document.getElementById('upiId')?.value || '';
        const totalAmount = calculatedGrandTotal || 0;

        previewContainer.innerHTML = `
          <div class="phone-frame">
            <div class="phone-screen">
              <div class="status-bar">
                <span>9:41</span>
                <span>📶 🔋</span>
              </div>
              
              <div class="app-header">
                <div class="app-icon">🌿</div>
                <div class="app-name">FreshCart Pay</div>
              </div>

              <div class="upi-amount">
                <div class="label">Amount to Pay</div>
                <div class="amount">$${totalAmount.toFixed(2)}</div>
              </div>

              <div class="upi-id-display">
                <div class="label">Pay to (UPI ID)</div>
                <div class="id">${upiId || '<span class="placeholder">Enter UPI ID</span>'}</div>
              </div>

              <div class="upi-keypad">
                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button data-value=".">.</button>
                <button data-value="0">0</button>
                <button data-value="backspace" class="backspace">⌫</button>
              </div>
            </div>
          </div>
        `;

        // Add keypad functionality
        const keypadButtons = previewContainer.querySelectorAll('.upi-keypad button');
        const upiInput = document.getElementById('upiId');
        
        if (upiInput) {
          keypadButtons.forEach(btn => {
            btn.addEventListener('click', () => {
              const value = btn.dataset.value;
              if (value === 'backspace') {
                upiInput.value = upiInput.value.slice(0, -1);
              } else {
                upiInput.value += value;
              }
              // Trigger input event to update preview
              upiInput.dispatchEvent(new Event('input'));
            });
          });
        }
      }

      // ==========================================================
      // RENDER PAYMENT CONTENT BASED ON METHOD
      // ==========================================================
      function renderPaymentContent() {
        const previewContainer = document.getElementById('previewContainer');
        const formContainer = document.getElementById('formContainer');
        if (!previewContainer || !formContainer) return;

        if (currentMethod === 'card') {
          previewContainer.innerHTML = `
            <div class="card-preview">
              <div class="credit-card visa" id="liveCard">
                <div class="card-shine" style="position:absolute;inset:0;pointer-events:none;"></div>
                <div style="display:flex;justify-content:space-between;align-items:center;position:relative;z-index:2;">
                  <div class="card-chip"></div>
                  <span class="card-brand" id="cardBrandDisplay">VISA</span>
                </div>
                <div class="card-number" style="position:relative;z-index:2;" id="cardNumberDisplay">
                  <span class="placeholder">•••• •••• •••• ••••</span>
                </div>
                <div class="card-footer" style="position:relative;z-index:2;">
                  <div class="card-holder">
                    CARD HOLDER
                    <span class="value" id="cardNameDisplay">JUSTIN MASON</span>
                  </div>
                  <div class="card-expiry">
                    EXPIRY
                    <span class="value" id="cardExpiryDisplay">MM/YY</span>
                  </div>
                </div>
                <div class="card-cvv" style="display:none;position:absolute;right:28px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.1);padding:4px 12px;border-radius:4px;font-family:'Courier New',monospace;font-size:1.2rem;letter-spacing:2px;font-weight:600;backdrop-filter:blur(4px);min-width:50px;text-align:center;z-index:3;" id="cardCvvDisplay">
                  <span class="placeholder">•••</span>
                </div>
              </div>
              <p style="text-align:center;font-size:0.5rem;color:#94A3B8;margin-top:8px;text-transform:uppercase;letter-spacing:0.1em;">
                Hover card to reveal CVV
              </p>
            </div>
          `;

          // Add hover to show CVV
          const card = previewContainer.querySelector('#liveCard');
          if (card) {
            card.addEventListener('mouseenter', () => {
              const cvv = card.querySelector('#cardCvvDisplay');
              if (cvv) cvv.style.display = 'block';
            });
            card.addEventListener('mouseleave', () => {
              const cvv = card.querySelector('#cardCvvDisplay');
              if (cvv) cvv.style.display = 'none';
            });
          }

          formContainer.innerHTML = `
            <div class="space-y-4">
              <div>
                <label class="block text-[0.6rem] font-bold uppercase tracking-[0.15em] text-slate-500 mb-1">Cardholder Name</label>
                <input type="text" id="cardName" placeholder="JUSTIN MASON" class="w-full px-4 py-3 bg-transparent border border-slate-200 dark:border-[#2D3E35] text-xs font-bold uppercase tracking-wider outline-none focus:border-[#6A8071] transition-colors">
              </div>
              <div>
                <label class="block text-[0.6rem] font-bold uppercase tracking-[0.15em] text-slate-500 mb-1">Card Number</label>
                <input type="text" id="cardNumber" placeholder="4242 4242 4242 4242" maxlength="19" class="w-full px-4 py-3 bg-transparent border border-slate-200 dark:border-[#2D3E35] text-xs font-bold uppercase tracking-wider outline-none focus:border-[#6A8071] transition-colors font-mono">
              </div>
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="block text-[0.6rem] font-bold uppercase tracking-[0.15em] text-slate-500 mb-1">Expiry Date</label>
                  <input type="text" id="cardExpiry" placeholder="MM/YY" maxlength="5" class="w-full px-4 py-3 bg-transparent border border-slate-200 dark:border-[#2D3E35] text-xs font-bold uppercase tracking-wider outline-none focus:border-[#6A8071] transition-colors">
                </div>
                <div>
                  <label class="block text-[0.6rem] font-bold uppercase tracking-[0.15em] text-slate-500 mb-1">CVV Security</label>
                  <input type="password" id="cardCvv" placeholder="•••" maxlength="4" class="w-full px-4 py-3 bg-transparent border border-slate-200 dark:border-[#2D3E35] text-xs font-bold uppercase tracking-wider outline-none focus:border-[#6A8071] transition-colors">
                </div>
              </div>
            </div>
          `;

          // Add live update listeners
          const cardName = document.getElementById('cardName');
          const cardNumber = document.getElementById('cardNumber');
          const cardExpiry = document.getElementById('cardExpiry');
          const cardCvv = document.getElementById('cardCvv');

          function updateCardPreview() {
            const nameDisplay = document.getElementById('cardNameDisplay');
            const numberDisplay = document.getElementById('cardNumberDisplay');
            const expiryDisplay = document.getElementById('cardExpiryDisplay');
            const cvvDisplay = document.getElementById('cardCvvDisplay');
            const brandDisplay = document.getElementById('cardBrandDisplay');

            if (nameDisplay) nameDisplay.textContent = cardName?.value || 'JUSTIN MASON';
            
            if (numberDisplay) {
              let num = cardNumber?.value || '';
              let formatted = num.replace(/\s/g, '');
              if (formatted.length > 0) {
                formatted = formatted.match(/.{1,4}/g)?.join(' ') || formatted;
              }
              numberDisplay.innerHTML = formatted || '<span class="placeholder">•••• •••• •••• ••••</span>';
              
              // Detect card type
              if (brandDisplay) {
                const first = num.replace(/\s/g, '')[0];
                if (first === '3') brandDisplay.textContent = 'AMEX';
                else if (first === '5') brandDisplay.textContent = 'MASTERCARD';
                else if (first === '4') brandDisplay.textContent = 'VISA';
                else brandDisplay.textContent = 'CARD';
              }
            }

            if (expiryDisplay) expiryDisplay.textContent = cardExpiry?.value || 'MM/YY';
            if (cvvDisplay) {
              const cvvVal = cardCvv?.value || '';
              cvvDisplay.innerHTML = cvvVal || '<span class="placeholder">•••</span>';
            }
          }

          [cardName, cardNumber, cardExpiry, cardCvv].forEach(input => {
            if (input) {
              input.addEventListener('input', updateCardPreview);
              input.addEventListener('keyup', updateCardPreview);
            }
          });

          // Initial update
          setTimeout(updateCardPreview, 50);

        } else if (currentMethod === 'upi') {
          renderUPIPreview();

          formContainer.innerHTML = `
            <div class="space-y-4">
              <div>
                <label class="block text-[0.6rem] font-bold uppercase tracking-[0.15em] text-slate-500 mb-1">Virtual Payment Address (UPI ID)</label>
                <input type="text" id="upiId" placeholder="username@okhdfcbank" class="w-full px-4 py-3 bg-transparent border border-slate-200 dark:border-[#2D3E35] text-xs font-bold uppercase tracking-wider outline-none focus:border-[#6A8071] transition-colors">
                <p class="text-[0.5rem] text-slate-400 uppercase tracking-wider mt-2">💡 Use the keypad on the phone to enter UPI ID</p>
              </div>
              <div class="p-4 border border-slate-200 dark:border-[#2D3E35] bg-slate-50 dark:bg-[#18221D] text-xs text-slate-600 dark:text-slate-300 uppercase tracking-wider leading-relaxed">
                <p class="font-bold text-[#6A8071]">📱 UPI Payment</p>
                <p class="mt-1">Enter your UPI ID and authorize payment through your UPI app. You'll receive a collect request on your registered mobile app.</p>
              </div>
            </div>
          `;

          // Update UPI preview on input
          const upiInput = document.getElementById('upiId');
          if (upiInput) {
            upiInput.addEventListener('input', renderUPIPreview);
          }

        } else {
          // Cash on Delivery
          previewContainer.innerHTML = `
            <div class="flex flex-col items-center justify-center p-8 text-center border-2 border-dashed border-slate-200 dark:border-[#2D3E35] w-full max-w-sm mx-auto">
              <div style="font-size:4rem;margin-bottom:12px;">💵</div>
              <h3 class="font-bold text-xl uppercase">Cash on Delivery</h3>
              <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Pay with physical cash upon delivery. Our zero-emission courier will verify the exchange at your doorstep.</p>
              <div class="mt-4 text-xs font-bold uppercase tracking-[0.15em] text-[#6A8071]">✅ No advance payment required</div>
            </div>
          `;

          formContainer.innerHTML = `
            <div class="space-y-4">
              <div class="p-6 border border-slate-200 dark:border-[#2D3E35] bg-slate-50 dark:bg-[#18221D]">
                <p class="text-xs text-slate-600 dark:text-slate-300 uppercase tracking-wider leading-relaxed">
                  Pay with physical cash upon delivery. Our zero-emission courier will verify the exchange at your doorstep.
                </p>
                <div class="mt-4 p-4 bg-[#6A8071]/10 border border-[#6A8071]/30">
                  <p class="text-xs font-bold uppercase tracking-[0.1em] text-[#6A8071]">📦 Delivery Instructions</p>
                  <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Keep exact cash ready for a smooth handover experience.</p>
                </div>
              </div>
            </div>
          `;
        }
      }

      // ==========================================================
      // SWITCH PAYMENT METHOD
      // ==========================================================
      window.switchPayMethod = (method) => {
        currentMethod = method;
        document.querySelectorAll('.pay-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${method}`).classList.add('active');
        renderPaymentContent();
      };

      // ==========================================================
      // CART RENDER
      // ==========================================================
      const renderCart = () => {
        const cart = FreshCartDB.getCart();

        if (cart.length === 0) {
          container.innerHTML = `
            <div class="col-span-full py-20 text-center space-y-6 market-card p-12">
              <h2 class="dashboard-heading text-2xl">Your bag is currently empty.</h2>
              <p class="text-xs uppercase tracking-[0.15em] text-slate-500">Explore our botanical marketplace to add organic farm provisions.</p>
              <a href="shop.html" class="inline-block px-8 py-4 bg-[#24302A] text-white dark:bg-white dark:text-[#24302A] text-xs font-bold tracking-[0.15em] uppercase hover:bg-[#6A8071] transition-all">Explore Marketplace →</a>
            </div>
          `;
          return;
        }

        let subtotal = 0;
        const itemsHTML = cart.map(cartItem => {
          const product = FreshCartDB.products.find(p => p.id === cartItem.id);
          if (!product) return '';
          const itemTotal = product.price * cartItem.qty;
          subtotal += itemTotal;

          return `
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between p-6 market-card gap-6">
              <div class="flex items-center gap-6">
                <img src="${product.image}" alt="${product.name}" class="w-20 h-20 object-cover border border-slate-200 dark:border-[#2D3E35]">
                <div class="space-y-1">
                  <a href="product-detail.html?id=${product.id}" class="text-sm font-bold uppercase tracking-wide hover:text-[#6A8071] transition-colors">${product.name}</a>
                  <p class="text-[0.6rem] font-bold uppercase tracking-[0.15em] text-slate-500">Parcel / ${product.category}</p>
                  <p class="text-xs font-bold uppercase tracking-wider">$${product.price.toFixed(2)} each</p>
                </div>
              </div>

              <div class="flex items-center gap-6 w-full sm:w-auto justify-between sm:justify-end">
                <div class="flex items-center border border-slate-200 dark:border-[#2D3E35] overflow-hidden text-xs">
                  <button onclick="updateQty('${product.id}', ${cartItem.qty - 1})" class="px-3.5 py-2 hover:bg-[#6A8071] hover:text-white transition-colors cursor-pointer">-</button>
                  <span class="px-4 py-2 font-bold">${cartItem.qty}</span>
                  <button onclick="updateQty('${product.id}', ${cartItem.qty + 1})" class="px-3.5 py-2 hover:bg-[#6A8071] hover:text-white transition-colors cursor-pointer">+</button>
                </div>
                <span class="font-extrabold text-lg w-24 text-right">$${itemTotal.toFixed(2)}</span>
                <button onclick="removeItem('${product.id}')" class="text-[0.6rem] font-bold uppercase tracking-[0.15em] text-red-500 hover:underline cursor-pointer">Remove</button>
              </div>
            </div>
          `;
        }).join('');

        const shipping = subtotal > 50 ? 0 : 4.99;
        const tax = subtotal * 0.08;
        calculatedGrandTotal = subtotal + shipping + tax;
        activeTotals = { subtotal, shipping, tax };

        container.innerHTML = `
          <!-- Cart Items List -->
          <div class="lg:col-span-8 space-y-4">
            ${itemsHTML}
          </div>

          <!-- Order Summary Ledger -->
          <div class="lg:col-span-4 market-card p-8 space-y-6 sticky top-28">
            <h3 class="dashboard-heading text-xl border-b border-slate-200 dark:border-[#2D3E35] pb-4">Order Summary</h3>
            
            <div class="space-y-3 text-xs font-bold uppercase tracking-[0.1em] text-slate-500">
              <div class="flex justify-between">
                <span>Subtotal</span>
                <span class="text-slate-900 dark:text-white">$${subtotal.toFixed(2)}</span>
              </div>
              <div class="flex justify-between">
                <span>Cold-Chain Shipping</span>
                <span class="text-slate-900 dark:text-white">${shipping === 0 ? 'FREE (Over $50)' : '$' + shipping.toFixed(2)}</span>
              </div>
              <div class="flex justify-between">
                <span>Estimated Tax (8%)</span>
                <span class="text-slate-900 dark:text-white">$${tax.toFixed(2)}</span>
              </div>
            </div>

            <div class="border-t border-slate-200 dark:border-[#2D3E35] pt-4 flex justify-between items-center font-extrabold text-xl">
              <span>Grand Total</span>
              <span class="text-[#6A8071]">$${calculatedGrandTotal.toFixed(2)}</span>
            </div>

            <button onclick="openPaymentModal()" class="sage-btn">
              Proceed to Secure Checkout →
            </button>
          </div>
        `;
      };

      // ==========================================================
      // CART FUNCTIONS
      // ==========================================================
      window.updateQty = (productId, newQty) => {
        let cart = FreshCartDB.getCart();
        if (newQty <= 0) {
          cart = cart.filter(item => item.id !== productId);
        } else {
          const item = cart.find(item => item.id === productId);
          if (item) item.qty = newQty;
        }
        FreshCartDB.saveCart(cart);
        renderCart();
      };

      window.removeItem = (productId) => {
        let cart = FreshCartDB.getCart();
        cart = cart.filter(item => item.id !== productId);
        FreshCartDB.saveCart(cart);
        renderCart();
        showToast("✓ Item removed from bag");
      };

      // ==========================================================
      // PAYMENT MODAL
      // ==========================================================
      window.openPaymentModal = () => {
        const cart = FreshCartDB.getCart();
        if (cart.length === 0) {
          showToast("⚠️ Your bag is empty.");
          return;
        }
        document.getElementById('paymentModal').classList.remove('hidden');
        renderPaymentContent();
      };

      window.closePaymentModal = () => {
        document.getElementById('paymentModal').classList.add('hidden');
      };

      // ==========================================================
      // CONFIRM PAYMENT
      // ==========================================================
      window.confirmPayment = () => {
        if (currentMethod === 'card') {
          const cardName = document.getElementById('cardName').value.trim();
          const cardNumber = document.getElementById('cardNumber').value.trim();
          const cardExpiry = document.getElementById('cardExpiry').value.trim();
          const cardCvv = document.getElementById('cardCvv').value.trim();
          if (!cardName || !cardNumber || !cardExpiry || !cardCvv) {
            showToast("⚠️ Please fill in all card payment details.");
            return;
          }
          if (cardNumber.replace(/\s/g, '').length < 16) {
            showToast("⚠️ Please enter a valid 16-digit card number.");
            return;
          }
        } else if (currentMethod === 'upi') {
          const upiId = document.getElementById('upiId').value.trim();
          if (!upiId || !upiId.includes('@')) {
            showToast("⚠️ Please enter a valid UPI ID (e.g., name@bank).");
            return;
          }
        }

        activeCartSnapshot = FreshCartDB.getCart();
        closePaymentModal();
        
        const successModal = document.getElementById('successModal');
        const animContainer = document.getElementById('animationContainer');
        const titleEl = document.getElementById('modalStatusTitle');
        const subtitleEl = document.getElementById('modalStatusSubtitle');
        const thermalArea = document.getElementById('thermalPrinterArea');
        const paperContainer = document.getElementById('receiptPaperContainer');
        const closeBtn = document.getElementById('successCloseBtn');

        successModal.classList.remove('hidden');
        thermalArea.classList.add('hidden');
        closeBtn.classList.add('hidden');

        // Show appropriate animation
        if (currentMethod === 'card') {
          titleEl.textContent = "Processing Card Payment...";
          subtitleEl.textContent = "Verifying with your bank.";
          animContainer.innerHTML = `
            <div class="biometric-scanner">
              <div class="biometric-inner">
                <svg width="28" height="28" fill="none" stroke="#6A8071" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0115.171 17m3.839-1.332c.643-1.25.99-2.668.99-4.168a7 7 0 10-14 0c0 1.442.327 2.81 9.155 4.024"/></svg>
              </div>
            </div>
          `;
        } else if (currentMethod === 'upi') {
          titleEl.textContent = "Processing UPI Payment...";
          subtitleEl.textContent = "Waiting for app confirmation.";
          animContainer.innerHTML = `
            <div class="upi-radar-wrap">
              <div class="radar-sweep"></div>
              <svg width="22" height="22" fill="none" stroke="#6A8071" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
            </div>
          `;
        } else {
          titleEl.textContent = "Confirming Cash Order...";
          subtitleEl.textContent = "Registering your order.";
          animContainer.innerHTML = `
            <div class="vault-lock-wrap">
              <svg width="32" height="32" fill="none" stroke="#6A8071" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
          `;
        }

        // After 2 seconds, show success
        setTimeout(() => {
          titleEl.textContent = "Payment Successful! 🎉";
          subtitleEl.textContent = "Your order has been confirmed.";
          animContainer.innerHTML = `
            <div style="width: 64px; height: 64px; background: #22C55E; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; color: white; font-weight: bold; font-size: 2rem; animation: successPulse 0.6s ease-in-out 3;">✓</div>
          `;

          // Show receipt after success
          setTimeout(() => {
            titleEl.textContent = "Order Confirmed!";
            subtitleEl.textContent = "Your receipt is being printed...";
            
            const dateStr = new Date().toLocaleString();
            const itemsListText = activeCartSnapshot.map(ci => {
              const p = FreshCartDB.products.find(prod => prod.id === ci.id);
              const lineTotal = p ? p.price * ci.qty : 0;
              return `<div style="display: flex; justify-content: space-between; margin-bottom: 3px;"><span>${ci.qty}x ${p ? p.name : 'Item'}</span><span>$${lineTotal.toFixed(2)}</span></div>`;
            }).join('');

            paperContainer.innerHTML = `
              <div class="receipt-paper">
                <div style="text-align: center; border-bottom: 1px dashed #94A3B8; padding-bottom: 8px; margin-bottom: 8px;">
                  <p style="font-weight: bold; font-size: 0.8rem;">FRESHCART BOTANICAL</p>
                  <p style="font-size: 0.55rem; color: #64748B;">SECURE TELEMETRY RECEIPT</p>
                  <p style="font-size: 0.5rem; color: #64748B; margin-top: 2px;">${dateStr}</p>
                </div>
                <div style="font-size: 0.65rem; margin-bottom: 8px;">
                  ${itemsListText}
                </div>
                <div style="border-top: 1px dashed #94A3B8; padding-top: 6px; font-size: 0.65rem;">
                  <div style="display: flex; justify-content: space-between;"><span>Subtotal:</span><span>$${activeTotals.subtotal.toFixed(2)}</span></div>
                  <div style="display: flex; justify-content: space-between;"><span>Shipping:</span><span>$${activeTotals.shipping.toFixed(2)}</span></div>
                  <div style="display: flex; justify-content: space-between;"><span>Tax (8%):</span><span>$${activeTotals.tax.toFixed(2)}</span></div>
                  <div style="display: flex; justify-content: space-between; font-weight: bold; margin-top: 4px; border-top: 1px solid #0F172A; padding-top: 4px;"><span>TOTAL (${currentMethod.toUpperCase()}):</span><span>$${calculatedGrandTotal.toFixed(2)}</span></div>
                </div>
                <div style="text-align: center; font-size: 0.5rem; color: #64748B; margin-top: 12px;">
                  <p>THANK YOU FOR YOUR PATRONAGE</p>
                  <p>NODE ID: #FC-9082-TR</p>
                </div>
              </div>
            `;
            thermalArea.classList.remove('hidden');
            closeBtn.classList.remove('hidden');

            // Clear Cart
            localStorage.removeItem('freshcart_cart');
            window.dispatchEvent(new Event('cartUpdated'));

          }, 1000);

        }, 2000);
      };

      // ==========================================================
      // CLOSE SUCCESS MODAL
      // ==========================================================
      window.closeSuccessModal = () => {
        document.getElementById('successModal').classList.add('hidden');
        window.location.href = 'index.html';
      };

      // ==========================================================
      // TOAST
      // ==========================================================
      function showToast(message) {
        let container = document.getElementById('toast-container');
        if (!container) {
          container = document.createElement('div');
          container.id = 'toast-container';
          container.className = 'fixed bottom-8 right-8 z-50 flex flex-col gap-3 pointer-events-none';
          document.body.appendChild(container);
        }
        const toast = document.createElement('div');
        toast.className = 'market-toast pointer-events-auto transform translate-y-4 opacity-0 transition-all duration-300';
        toast.textContent = message;
        container.appendChild(toast);
        requestAnimationFrame(() => toast.classList.remove('translate-y-4', 'opacity-0'));
        setTimeout(() => {
          toast.classList.add('translate-y-4', 'opacity-0');
          setTimeout(() => toast.remove(), 400);
        }, 2500);
      }

      // Initial render
      renderCart();

      // Render payment content when modal opens
      const modalObserver = new MutationObserver(() => {
        const modal = document.getElementById('paymentModal');
        if (!modal.classList.contains('hidden')) {
          renderPaymentContent();
        }
      });
      modalObserver.observe(document.getElementById('paymentModal'), { attributes: true, attributeFilter: ['class'] });
    });
  </script>

</body>
</html>
