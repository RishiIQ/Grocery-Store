<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/images/grossary-logo.png">
  <script>
  (function() {
    // Instant Theme Init
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    // Instant Direction Init
    const savedDir = localStorage.getItem('dir') || 'ltr';
    document.documentElement.setAttribute('dir', savedDir);
  })();
</script>
  <title>Shopping Bag — FreshCart Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'nixon-red': '#E31837',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Nixon Typography & Card UI */
    .nixon-heading {
      font-family: 'Arial Black', 'Impact', sans-serif;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }
    .nixon-subheading {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      font-weight: 700;
    }
    .nixon-card {
      background: #FFFFFF;
      border: 1px solid #E5E5E5;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .dark .nixon-card {
      background: #1A1A1A;
      border-color: #333333;
    }
    .nixon-card:hover {
      border-color: #E31837;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.08);
    }
    .dark .nixon-card:hover {
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.4);
    }
    .nixon-btn {
      display: inline-block;
      padding: 16px 32px;
      background: #E31837;
      color: #FFFFFF;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      border: none;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      text-decoration: none;
      width: 100%;
    }
    .nixon-btn:hover {
      background: #C41230;
      transform: scale(1.02);
    }

    /* Dribbble-style Success Animation Styles */
    .success-checkmark {
      width: 80px;
      height: 80px;
      margin: 0 auto;
      position: relative;
    }
    .check-icon {
      width: 80px;
      height: 80px;
      position: relative;
      border-radius: 50%;
      box-sizing: content-box;
      border: 4px solid #4bb71b;
    }
    .check-icon::before {
      top: 3px;
      left: -2px;
      width: 30px;
      transform-origin: 100% 50%;
      border-radius: 100px 0 0 100px;
    }
    .check-icon::after {
      top: 0;
      left: 30px;
      width: 60px;
      transform-origin: 0 50%;
      border-radius: 0 100px 100px 0;
      animation: rotate-circle 4.25s ease-in;
    }
    .check-icon .icon-line {
      height: 5px;
      background-color: #4bb71b;
      display: block;
      border-radius: 2px;
      position: absolute;
      z-index: 10;
    }
    .check-icon .icon-line.line-tip {
      top: 46px;
      left: 14px;
      width: 25px;
      transform: rotate(45deg);
      animation: icon-line-tip 0.75s;
    }
    .check-icon .icon-line.line-long {
      top: 38px;
      right: 8px;
      width: 47px;
      transform: rotate(-45deg);
      animation: icon-line-long 0.75s;
    }
    @keyframes icon-line-tip {
      0% { width: 0; left: 1px; top: 19px; }
      54% { width: 0; left: 1px; top: 19px; }
      70% { width: 50px; left: -8px; top: 37px; }
      84% { width: 17px; left: 21px; top: 48px; }
      100% { width: 25px; left: 14px; top: 46px; }
    }
    @keyframes icon-line-long {
      0% { width: 0; right: 46px; top: 54px; }
      65% { width: 0; right: 46px; top: 54px; }
      84% { width: 55px; right: 0px; top: 35px; }
      100% { width: 47px; right: 8px; top: 38px; }
    }
  </style>
</head>
<body class="bg-white dark:bg-[#0A0A0A] text-slate-900 dark:text-white antialiased transition-colors duration-500">

  <!-- Shared DB and Layout Injector Scripts -->
  <script src="js/db.js"></script>
  <script src="js/layout.js"></script>

  <!-- Cart Bag Main Section -->
  <main class="pt-40 pb-36 px-4 sm:px-6 lg:px-12 max-w-7xl mx-auto space-y-12">
    <div class="border-b border-[#E5E5E5] dark:border-[#222222] pb-8">
      <p class="nixon-subheading text-[#E31837]">( Secure Telemetry Checkout )</p>
      <h1 class="nixon-heading text-4xl sm:text-6xl mt-2">Shopping Bag.</h1>
    </div>

    <div id="cartContainer" class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
      <!-- Injected via JavaScript below -->
    </div>
  </main>

  <!-- Payment Modal Container -->
  <div id="paymentModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden">
    <div class="nixon-card p-8 max-w-md w-full mx-4 space-y-6 relative">
      <div class="flex justify-between items-center border-b border-[#E5E5E5] dark:border-[#333333] pb-4">
        <h3 class="nixon-heading text-xl">Secure Payment Gateway</h3>
        <button onclick="closePaymentModal()" class="text-[#8A8A8A] hover:text-[#E31837] font-bold text-lg">✕</button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-[0.6rem] font-bold uppercase tracking-[0.15em] text-[#8A8A8A] mb-1">Cardholder Name</label>
          <input type="text" id="cardName" placeholder="JUSTIN MASON" class="w-full px-4 py-3 bg-transparent border border-[#E5E5E5] dark:border-[#333333] text-xs font-bold uppercase tracking-wider outline-none focus:border-[#E31837]">
        </div>
        <div>
          <label class="block text-[0.6rem] font-bold uppercase tracking-[0.15em] text-[#8A8A8A] mb-1">Card Number</label>
          <input type="text" id="cardNumber" placeholder="4242 •••• •••• 4242" maxlength="19" class="w-full px-4 py-3 bg-transparent border border-[#E5E5E5] dark:border-[#333333] text-xs font-bold uppercase tracking-wider outline-none focus:border-[#E31837]">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[0.6rem] font-bold uppercase tracking-[0.15em] text-[#8A8A8A] mb-1">Expiry Date</label>
            <input type="text" id="cardExpiry" placeholder="MM/YY" maxlength="5" class="w-full px-4 py-3 bg-transparent border border-[#E5E5E5] dark:border-[#333333] text-xs font-bold uppercase tracking-wider outline-none focus:border-[#E31837]">
          </div>
          <div>
            <label class="block text-[0.6rem] font-bold uppercase tracking-[0.15em] text-[#8A8A8A] mb-1">CVV Security</label>
            <input type="password" id="cardCvv" placeholder="•••" maxlength="4" class="w-full px-4 py-3 bg-transparent border border-[#E5E5E5] dark:border-[#333333] text-xs font-bold uppercase tracking-wider outline-none focus:border-[#E31837]">
          </div>
        </div>
      </div>
      <button onclick="confirmPayment()" class="nixon-btn mt-4">
        Authorize & Pay Now →
      </button>
    </div>
  </div>

  <!-- Success Animation Modal Container -->
  <div id="successModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md hidden">
    <div class="nixon-card p-10 max-w-sm w-full mx-4 text-center space-y-6">
      <div class="success-checkmark">
        <div class="check-icon">
          <span class="icon-line line-tip"></span>
          <span class="icon-line line-long"></span>
        </div>
      </div>
      <div class="space-y-2">
        <h3 class="nixon-heading text-2xl">Payment Successful!</h3>
        <p class="text-[0.65rem] font-['Helvetica_Neue'] uppercase tracking-[0.15em] text-[#8A8A8A]">Cold-chain telemetry dispatch initiated.</p>
      </div>
      <div class="pt-2">
        <span class="text-xs font-mono text-[#E31837] uppercase font-bold animate-pulse">Redirecting to portal...</span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('cartContainer');
      if (!container || !window.FreshCartDB) return;

      let calculatedGrandTotal = 0;

      const renderCart = () => {
        const cart = FreshCartDB.getCart();

        if (cart.length === 0) {
          container.innerHTML = `
            <div class="col-span-full py-20 text-center space-y-6 nixon-card p-12">
              <h2 class="nixon-heading text-2xl">Your bag is currently empty.</h2>
              <p class="text-xs font-['Helvetica_Neue'] uppercase tracking-[0.15em] text-[#8A8A8A]">Explore our marketplace to add organic farm provisions.</p>
              <a href="shop.html" class="inline-block px-8 py-4 bg-black text-white dark:bg-white dark:text-black font-['Helvetica_Neue'] text-xs font-bold tracking-[0.15em] uppercase hover:bg-[#E31837] hover:text-white transition-all">Explore Marketplace →</a>
            </div>
          `;
          return;
        }

        let subtotal = 0;
        const itemsHTML = cart.map(cartItem => {
          const product = FreshCartDB.products.find(p => p.id === cartItem.id);
          if (!product) return '';
          const itemTotal = product.price * cartItem.qty;
          subtotal += itemTotal;

          return `
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between p-6 nixon-card gap-6">
              <div class="flex items-center gap-6">
                <img src="${product.image}" alt="${product.name}" class="w-20 h-20 object-cover border border-[#E5E5E5] dark:border-[#333333]">
                <div class="space-y-1">
                  <a href="product-detail.html?id=${product.id}" class="font-['Helvetica_Neue'] text-sm font-bold uppercase tracking-wide hover:text-[#E31837] transition-colors">${product.name}</a>
                  <p class="text-[0.6rem] font-bold uppercase tracking-[0.15em] text-[#8A8A8A]">Sector / ${product.category}</p>
                  <p class="text-xs font-bold uppercase tracking-wider">$${product.price.toFixed(2)} each</p>
                </div>
              </div>

              <div class="flex items-center gap-6 w-full sm:w-auto justify-between sm:justify-end">
                <div class="flex items-center border border-[#E5E5E5] dark:border-[#333333] overflow-hidden text-xs">
                  <button onclick="updateQty('${product.id}', ${cartItem.qty - 1})" class="px-3.5 py-2 hover:bg-[#E31837] hover:text-white transition-colors">-</button>
                  <span class="px-4 py-2 font-bold">${cartItem.qty}</span>
                  <button onclick="updateQty('${product.id}', ${cartItem.qty + 1})" class="px-3.5 py-2 hover:bg-[#E31837] hover:text-white transition-colors">+</button>
                </div>
                <span class="font-['Arial_Black'] text-lg w-24 text-right">$${itemTotal.toFixed(2)}</span>
                <button onclick="removeItem('${product.id}')" class="text-[0.6rem] font-bold uppercase tracking-[0.15em] text-[#E31837] hover:underline">Remove</button>
              </div>
            </div>
          `;
        }).join('');

        const shipping = subtotal > 50 ? 0 : 4.99;
        const tax = subtotal * 0.08;
        calculatedGrandTotal = subtotal + shipping + tax;

        container.innerHTML = `
          <!-- Cart Items List -->
          <div class="lg:col-span-8 space-y-4">
            ${itemsHTML}
          </div>

          <!-- Order Summary Ledger -->
          <div class="lg:col-span-4 nixon-card p-8 space-y-6 sticky top-28">
            <h3 class="nixon-heading text-xl border-b border-[#E5E5E5] dark:border-[#333333] pb-4">Order Summary</h3>
            
            <div class="space-y-3 text-xs font-bold uppercase tracking-[0.1em] text-[#8A8A8A]">
              <div class="flex justify-between">
                <span>Subtotal</span>
                <span class="text-black dark:text-white">$${subtotal.toFixed(2)}</span>
              </div>
              <div class="flex justify-between">
                <span>Cold-Chain Shipping</span>
                <span class="text-black dark:text-white">${shipping === 0 ? 'FREE (Over $50)' : '$' + shipping.toFixed(2)}</span>
              </div>
              <div class="flex justify-between">
                <span>Estimated Tax (8%)</span>
                <span class="text-black dark:text-white">$${tax.toFixed(2)}</span>
              </div>
            </div>

            <div class="border-t border-[#E5E5E5] dark:border-[#333333] pt-4 flex justify-between items-center font-['Arial_Black'] text-xl">
              <span>Grand Total</span>
              <span class="text-[#E31837]">$${calculatedGrandTotal.toFixed(2)}</span>
            </div>

            <button onclick="openPaymentModal()" class="nixon-btn">
              Proceed to Secure Checkout →
            </button>
          </div>
        `;
      };

      window.updateQty = (productId, newQty) => {
        let cart = FreshCartDB.getCart();
        if (newQty <= 0) {
          cart = cart.filter(item => item.id !== productId);
        } else {
          const item = cart.find(item => item.id === productId);
          if (item) item.qty = newQty;
        }
        FreshCartDB.saveCart(cart);
        renderCart();
      };

      window.removeItem = (productId) => {
        let cart = FreshCartDB.getCart();
        cart = cart.filter(item => item.id !== productId);
        FreshCartDB.saveCart(cart);
        renderCart();
        FreshCartUI.showToast("✓ Item removed from bag");
      };

      window.openPaymentModal = () => {
        const cart = FreshCartDB.getCart();
        if (cart.length === 0) {
          FreshCartUI.showToast("⚠️ Your bag is empty.");
          return;
        }
        document.getElementById('paymentModal').classList.remove('hidden');
      };

      window.closePaymentModal = () => {
        document.getElementById('paymentModal').classList.add('hidden');
      };

      window.confirmPayment = () => {
        const cardName = document.getElementById('cardName').value.trim();
        const cardNumber = document.getElementById('cardNumber').value.trim();
        const cardExpiry = document.getElementById('cardExpiry').value.trim();
        const cardCvv = document.getElementById('cardCvv').value.trim();

        if (!cardName || !cardNumber || !cardExpiry || !cardCvv) {
          FreshCartUI.showToast("⚠️ Please fill in all payment details.");
          return;
        }

        // Close payment modal and show success checkmark animation modal
        closePaymentModal();
        document.getElementById('successModal').classList.remove('hidden');

        localStorage.removeItem('freshcart_cart');
        window.dispatchEvent(new Event('cartUpdated'));

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 3000);
      };

      renderCart();
    });
  </script>
</body>
</html>
