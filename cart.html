<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/images/grossary-logo.png">
  <script>
  (function() {
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    const savedDir = localStorage.getItem('dir') || 'ltr';
    document.documentElement.setAttribute('dir', savedDir);
  })();
</script>
  <title>Shopping Bag & Modern Checkout — FreshCart Botanical Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'sage-accent': '#6A8071',
            'sage-dark': '#24302A',
            'cream-bg': '#F7F6F2',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">

  <style>
    .dashboard-heading {
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }
    .dashboard-subheading {
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      font-weight: 700;
      color: #6A8071;
    }
    .market-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 0px;
    }
    .dark .market-card {
      background: #18221D;
      border-color: #2D3E35;
    }
    .market-card:hover {
      border-color: #6A8071;
      box-shadow: 0 16px 48px rgba(106, 128, 113, 0.15);
    }
    .sage-btn {
      display: inline-block;
      padding: 16px 32px;
      background: #6A8071;
      color: #FFFFFF;
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      border: none;
      border-radius: 0px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      text-decoration: none;
      width: 100%;
    }
    .sage-btn:hover {
      background: #576B5D;
      transform: scale(1.02);
    }

    .pay-tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      border: 1px solid #E2E8F0;
      background: transparent;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .dark .pay-tab {
      border-color: #2D3E35;
      color: #94A3B8;
    }
    .pay-tab.active {
      background: #6A8071;
      color: #FFFFFF;
      border-color: #6A8071;
    }

    #successModal {
      transition: opacity 0.4s ease;
    }
    .success-card {
      transform: scale(0.95) translateY(10px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      border-radius: 0px;
      max-height: 94vh;
      overflow-y: auto;
    }
    #successModal:not(.hidden) .success-card {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    /* ==========================================================
       MODERN UI PAYMENT ANIMATIONS (FaceID, UPI Radar, Vault Lock)
       ================================================          */
    
    /* 1. Modern Card FaceID / Fingerprint Biometric Scan */
    .biometric-scanner {
      width: 76px;
      height: 76px;
      border: 2px dashed #6A8071;
      border-radius: 50%;
      margin: 0 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spinScanner 4s linear infinite;
    }
    @keyframes spinScanner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .biometric-inner {
      width: 56px;
      height: 56px;
      background: rgba(106, 128, 113, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulseInner 1s ease-in-out infinite alternate;
    }
    @keyframes pulseInner {
      0% { transform: scale(0.9); }
      100% { transform: scale(1.1); }
    }

    /* 2. Modern UPI Radar Sweep Animation */
    .upi-radar-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #18221D;
      border-radius: 50%;
      border: 1px solid #2D3E35;
      overflow: hidden;
    }
    .radar-sweep {
      width: 40px;
      height: 40px;
      border-top: 3px solid #6A8071;
      border-right: 3px solid transparent;
      border-radius: 100% 0 0 0;
      position: absolute;
      top: 0;
      right: 0;
      transform-origin: bottom left;
      animation: radarSpin 1.2s linear infinite;
    }
    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 3. Modern Cash Vault Lock Animation */
    .vault-lock-wrap {
      width: 76px;
      height: 76px;
      margin: 0 auto;
      background: #24302A;
      border: 2px solid #6A8071;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: vaultShake 0.6s infinite ease-in-out;
    }
    @keyframes vaultShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      75% { transform: translateX(3px); }
    }

    /* ==========================================================
       THERMAL RECEIPT PRINTER PHYSICS ANIMATION
       ================================================          */
    .printer-terminal {
      background: #1E293B;
      border: 2px solid #334155;
      padding: 12px;
      border-radius: 6px;
      width: 280px;
      margin: 0 auto;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .printer-slot {
      width: 100%;
      height: 6px;
      background: #0F172A;
      border-radius: 3px;
      margin-bottom: 4px;
      position: relative;
      overflow: hidden;
    }
    
    .receipt-paper {
      background: #FFFFFF;
      color: #0F172A;
      font-family: 'Courier New', Courier, monospace;
      padding: 20px;
      width: 260px;
      margin: 0 auto;
      border-left: 1px solid #CBD5E1;
      border-right: 1px solid #CBD5E1;
      border-bottom: 2px dashed #94A3B8;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      position: relative;
      transform-origin: top center;
      transform: translateY(-110%) scaleY(0.05);
      opacity: 0;
      animation: printReceipt 1.4s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      text-align: left;
    }
    @keyframes printReceipt {
      0% { transform: translateY(-110%) scaleY(0.05); opacity: 0; }
      70% { transform: translateY(0) scaleY(1.03); opacity: 1; }
      85% { transform: translateY(-4px) scaleY(0.98); opacity: 1; }
      100% { transform: translateY(0) scaleY(1); opacity: 1; }
    }

    .market-toast {
      background: #24302A;
      color: #FFFFFF;
      padding: 14px 24px;
      border-radius: 0px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      border-left: 4px solid #6A8071;
    }
  </style>
</head>
<body class="bg-cream-bg dark:bg-[#111814] text-slate-900 dark:text-slate-100 antialiased transition-colors duration-500">

  <!-- Shared DB and Layout Injector Scripts -->
  <script src="js/db.js"></script>
  <script src="js/layout.js"></script>

  <!-- Cart Bag Main Section -->
  <main class="pt-40 pb-36 px-4 sm:px-6 lg:px-12 max-w-7xl mx-auto space-y-12">
    <div class="border-b border-slate-200 dark:border-[#2D3E35] pb-8">
      <p class="dashboard-subheading">( Secure Telemetry Checkout )</p>
      <h1 class="dashboard-heading text-4xl sm:text-6xl mt-2">Shopping Bag.</h1>
    </div>

    <div id="cartContainer" class="grid grid-cols-1 lg:grid-cols-12 gap-12 items-start">
      <!-- Injected via JavaScript below -->
    </div>
  </main>

  <!-- Payment Modal Container -->
  <div id="paymentModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden">
    <div class="market-card p-8 max-w-md w-full mx-4 space-y-6 relative">
      <div class="flex justify-between items-center border-b border-slate-200 dark:border-[#2D3E35] pb-4">
        <h3 class="dashboard-heading text-xl">Secure Payment Gateway</h3>
        <button onclick="closePaymentModal()" class="text-slate-400 hover:text-[#6A8071] font-bold text-lg cursor-pointer">✕</button>
      </div>

      <!-- Payment Method Tabs -->
      <div class="flex gap-2">
        <button type="button" onclick="switchPayMethod('card')" id="tab-card" class="pay-tab active">Credit Card</button>
        <button type="button" onclick="switchPayMethod('upi')" id="tab-upi" class="pay-tab">UPI Transfer</button>
        <button type="button" onclick="switchPayMethod('cash')" id="tab-cash" class="pay-tab">Cash on Delivery</button>
      </div>

      <!-- Card Form -->
      <div id="panel-card" class="pay-panel space-y-4">
        <div>
          <label class="block text-[0.6rem] font-bold uppercase tracking-[0.15em] text-slate-500 mb-1">Cardholder Name</label>
          <input type="text" id="cardName" placeholder="JUSTIN MASON" class="w-full px-4 py-3 bg-transparent border border-slate-200 dark:border-[#2D3E35] text-xs font-bold uppercase tracking-wider outline-none focus:border-[#6A8071]">
        </div>
        <div>
          <label class="block text-[0.6rem] font-bold uppercase tracking-[0.15em] text-slate-500 mb-1">Card Number</label>
          <input type="text" id="cardNumber" placeholder="4242 •••• •••• 4242" maxlength="19" class="w-full px-4 py-3 bg-transparent border border-slate-200 dark:border-[#2D3E35] text-xs font-bold uppercase tracking-wider outline-none focus:border-[#6A8071]">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-[0.6rem] font-bold uppercase tracking-[0.15em] text-slate-500 mb-1">Expiry Date</label>
            <input type="text" id="cardExpiry" placeholder="MM/YY" maxlength="5" class="w-full px-4 py-3 bg-transparent border border-slate-200 dark:border-[#2D3E35] text-xs font-bold uppercase tracking-wider outline-none focus:border-[#6A8071]">
          </div>
          <div>
            <label class="block text-[0.6rem] font-bold uppercase tracking-[0.15em] text-slate-500 mb-1">CVV Security</label>
            <input type="password" id="cardCvv" placeholder="•••" maxlength="4" class="w-full px-4 py-3 bg-transparent border border-slate-200 dark:border-[#2D3E35] text-xs font-bold uppercase tracking-wider outline-none focus:border-[#6A8071]">
          </div>
        </div>
      </div>

      <!-- UPI Form -->
      <div id="panel-upi" class="pay-panel space-y-4 hidden">
        <div>
          <label class="block text-[0.6rem] font-bold uppercase tracking-[0.15em] text-slate-500 mb-1">Virtual Payment Address (UPI ID)</label>
          <input type="text" id="upiId" placeholder="username@okhdfcbank" class="w-full px-4 py-3 bg-transparent border border-slate-200 dark:border-[#2D3E35] text-xs font-bold uppercase tracking-wider outline-none focus:border-[#6A8071]">
        </div>
        <p class="text-[0.65rem] text-slate-500 uppercase tracking-wider">Triggers secure mobile app collect request.</p>
      </div>

      <!-- Cash Form -->
      <div id="panel-cash" class="pay-panel space-y-4 hidden">
        <div class="p-4 border border-slate-200 dark:border-[#2D3E35] bg-slate-50 dark:bg-[#18221D] text-xs text-slate-600 dark:text-slate-300 uppercase tracking-wider leading-relaxed">
          Pay with physical cash upon delivery. Our zero-emission courier will verify the exchange at your doorstep.
        </div>
      </div>

      <button onclick="confirmPayment()" class="sage-btn mt-4">
        Authorize & Complete Order →
      </button>
    </div>
  </div>

  <!-- Dynamic Success & Thermal Printer Bill Animation Modal -->
  <div id="successModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/95 backdrop-blur-xl hidden">
    <div class="success-card p-6 max-w-sm w-full mx-4 text-center space-y-4">
      
      <!-- Modern UI Payment Animation Container -->
      <div id="animationContainer"></div>

      <div class="space-y-1">
        <h3 id="modalStatusTitle" class="dashboard-heading text-lg">Processing Payment...</h3>
        <p id="modalStatusSubtitle" class="text-[0.6rem] uppercase tracking-[0.15em] text-slate-400">Communicating with financial nodes.</p>
      </div>

      <!-- Thermal Printer Receipt Area -->
      <div id="thermalPrinterArea" class="hidden pt-2">
        <div class="printer-terminal">
          <div class="printer-slot"></div>
          <div id="receiptPaperContainer"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('cartContainer');
      if (!container || !window.FreshCartDB) return;

      let calculatedGrandTotal = 0;
      let currentMethod = 'card';
      let activeCartSnapshot = [];
      let activeTotals = { subtotal: 0, shipping: 0, tax: 0 };

      window.switchPayMethod = (method) => {
        currentMethod = method;
        document.querySelectorAll('.pay-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${method}`).classList.add('active');

        document.querySelectorAll('.pay-panel').forEach(p => p.classList.add('hidden'));
        document.getElementById(`panel-${method}`).classList.remove('hidden');
      };

      const renderCart = () => {
        const cart = FreshCartDB.getCart();

        if (cart.length === 0) {
          container.innerHTML = `
            <div class="col-span-full py-20 text-center space-y-6 market-card p-12">
              <h2 class="dashboard-heading text-2xl">Your bag is currently empty.</h2>
              <p class="text-xs uppercase tracking-[0.15em] text-slate-500">Explore our botanical marketplace to add organic farm provisions.</p>
              <a href="shop.html" class="inline-block px-8 py-4 bg-[#24302A] text-white dark:bg-white dark:text-[#24302A] text-xs font-bold tracking-[0.15em] uppercase hover:bg-[#6A8071] transition-all">Explore Marketplace →</a>
            </div>
          `;
          return;
        }

        let subtotal = 0;
        const itemsHTML = cart.map(cartItem => {
          const product = FreshCartDB.products.find(p => p.id === cartItem.id);
          if (!product) return '';
          const itemTotal = product.price * cartItem.qty;
          subtotal += itemTotal;

          return `
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between p-6 market-card gap-6">
              <div class="flex items-center gap-6">
                <img src="${product.image}" alt="${product.name}" class="w-20 h-20 object-cover border border-slate-200 dark:border-[#2D3E35]">
                <div class="space-y-1">
                  <a href="product-detail.html?id=${product.id}" class="text-sm font-bold uppercase tracking-wide hover:text-[#6A8071] transition-colors">${product.name}</a>
                  <p class="text-[0.6rem] font-bold uppercase tracking-[0.15em] text-slate-500">Parcel / ${product.category}</p>
                  <p class="text-xs font-bold uppercase tracking-wider">$${product.price.toFixed(2)} each</p>
                </div>
              </div>

              <div class="flex items-center gap-6 w-full sm:w-auto justify-between sm:justify-end">
                <div class="flex items-center border border-slate-200 dark:border-[#2D3E35] overflow-hidden text-xs">
                  <button onclick="updateQty('${product.id}', ${cartItem.qty - 1})" class="px-3.5 py-2 hover:bg-[#6A8071] hover:text-white transition-colors cursor-pointer">-</button>
                  <span class="px-4 py-2 font-bold">${cartItem.qty}</span>
                  <button onclick="updateQty('${product.id}', ${cartItem.qty + 1})" class="px-3.5 py-2 hover:bg-[#6A8071] hover:text-white transition-colors cursor-pointer">+</button>
                </div>
                <span class="font-extrabold text-lg w-24 text-right">$${itemTotal.toFixed(2)}</span>
                <button onclick="removeItem('${product.id}')" class="text-[0.6rem] font-bold uppercase tracking-[0.15em] text-red-500 hover:underline cursor-pointer">Remove</button>
              </div>
            </div>
          `;
        }).join('');

        const shipping = subtotal > 50 ? 0 : 4.99;
        const tax = subtotal * 0.08;
        calculatedGrandTotal = subtotal + shipping + tax;
        activeTotals = { subtotal, shipping, tax };

        container.innerHTML = `
          <!-- Cart Items List -->
          <div class="lg:col-span-8 space-y-4">
            ${itemsHTML}
          </div>

          <!-- Order Summary Ledger -->
          <div class="lg:col-span-4 market-card p-8 space-y-6 sticky top-28">
            <h3 class="dashboard-heading text-xl border-b border-slate-200 dark:border-[#2D3E35] pb-4">Order Summary</h3>
            
            <div class="space-y-3 text-xs font-bold uppercase tracking-[0.1em] text-slate-500">
              <div class="flex justify-between">
                <span>Subtotal</span>
                <span class="text-slate-900 dark:text-white">$${subtotal.toFixed(2)}</span>
              </div>
              <div class="flex justify-between">
                <span>Cold-Chain Shipping</span>
                <span class="text-slate-900 dark:text-white">${shipping === 0 ? 'FREE (Over $50)' : '$' + shipping.toFixed(2)}</span>
              </div>
              <div class="flex justify-between">
                <span>Estimated Tax (8%)</span>
                <span class="text-slate-900 dark:text-white">$${tax.toFixed(2)}</span>
              </div>
            </div>

            <div class="border-t border-slate-200 dark:border-[#2D3E35] pt-4 flex justify-between items-center font-extrabold text-xl">
              <span>Grand Total</span>
              <span class="text-[#6A8071]">$${calculatedGrandTotal.toFixed(2)}</span>
            </div>

            <button onclick="openPaymentModal()" class="sage-btn">
              Proceed to Secure Checkout →
            </button>
          </div>
        `;
      };

      window.updateQty = (productId, newQty) => {
        let cart = FreshCartDB.getCart();
        if (newQty <= 0) {
          cart = cart.filter(item => item.id !== productId);
        } else {
          const item = cart.find(item => item.id === productId);
          if (item) item.qty = newQty;
        }
        FreshCartDB.saveCart(cart);
        renderCart();
      };

      window.removeItem = (productId) => {
        let cart = FreshCartDB.getCart();
        cart = cart.filter(item => item.id !== productId);
        FreshCartDB.saveCart(cart);
        renderCart();
        showToast("✓ Item removed from bag");
      };

      window.openPaymentModal = () => {
        const cart = FreshCartDB.getCart();
        if (cart.length === 0) {
          showToast("⚠️ Your bag is empty.");
          return;
        }
        document.getElementById('paymentModal').classList.remove('hidden');
      };

      window.closePaymentModal = () => {
        document.getElementById('paymentModal').classList.add('hidden');
      };

      window.confirmPayment = () => {
        if (currentMethod === 'card') {
          const cardName = document.getElementById('cardName').value.trim();
          const cardNumber = document.getElementById('cardNumber').value.trim();
          const cardExpiry = document.getElementById('cardExpiry').value.trim();
          const cardCvv = document.getElementById('cardCvv').value.trim();
          if (!cardName || !cardNumber || !cardExpiry || !cardCvv) {
            showToast("⚠️ Please fill in all card payment details.");
            return;
          }
        } else if (currentMethod === 'upi') {
          const upiId = document.getElementById('upiId').value.trim();
          if (!upiId || !upiId.includes('@')) {
            showToast("⚠️ Please enter a valid UPI ID.");
            return;
          }
        }

        activeCartSnapshot = FreshCartDB.getCart();
        closePaymentModal();
        
        const successModal = document.getElementById('successModal');
        const animContainer = document.getElementById('animationContainer');
        const titleEl = document.getElementById('modalStatusTitle');
        const subtitleEl = document.getElementById('modalStatusSubtitle');
        const thermalArea = document.getElementById('thermalPrinterArea');
        const paperContainer = document.getElementById('receiptPaperContainer');

        successModal.classList.remove('hidden');
        thermalArea.classList.add('hidden');

        // 1. Render Modern UI Payment Animation
        if (currentMethod === 'card') {
          titleEl.textContent = "Biometric Face/Touch ID...";
          subtitleEl.textContent = "Authenticating secure card token.";
          animContainer.innerHTML = `
            <div class="biometric-scanner">
              <div class="biometric-inner">
                <svg width="28" height="28" fill="none" stroke="#6A8071" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0115.171 17m3.839-1.332c.643-1.25.99-2.668.99-4.168a7 7 0 10-14 0c0 1.442.327 2.81 9.155 4.024"/></svg>
              </div>
            </div>
          `;
        } else if (currentMethod === 'upi') {
          titleEl.textContent = "Scanning UPI Network...";
          subtitleEl.textContent = "Waiting for app pin confirmation.";
          animContainer.innerHTML = `
            <div class="upi-radar-wrap">
              <div class="radar-sweep"></div>
              <svg width="22" height="22" fill="none" stroke="#6A8071" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"/></svg>
            </div>
          `;
        } else {
          titleEl.textContent = "Locking Cash Order...";
          subtitleEl.textContent = "Registering transaction to dispatch queue.";
          animContainer.innerHTML = `
            <div class="vault-lock-wrap">
              <svg width="32" height="32" fill="none" stroke="#6A8071" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
          `;
        }

        // 2. After 2.0 seconds, trigger Thermal Printer Receipt Animation
        setTimeout(() => {
          titleEl.textContent = "Payment Authorized!";
          subtitleEl.textContent = "Printing itemized receipt...";
          animContainer.innerHTML = `
            <div style="width: 32px; height: 32px; background: #6A8071; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; color: white; font-weight: bold; font-size: 0.9rem;">✓</div>
          `;

          const dateStr = new Date().toLocaleString();
          const itemsListText = activeCartSnapshot.map(ci => {
            const p = FreshCartDB.products.find(prod => prod.id === ci.id);
            const lineTotal = p ? p.price * ci.qty : 0;
            return `<div style="display: flex; justify-content: space-between; margin-bottom: 3px;"><span>${ci.qty}x ${p ? p.name : 'Item'}</span><span>$${lineTotal.toFixed(2)}</span></div>`;
          }).join('');

          paperContainer.innerHTML = `
            <div class="receipt-paper">
              <div style="text-align: center; border-bottom: 1px dashed #94A3B8; padding-bottom: 8px; margin-bottom: 8px;">
                <p style="font-weight: bold; font-size: 0.8rem;">FRESHCART BOTANICAL</p>
                <p style="font-size: 0.55rem; color: #64748B;">SECURE TELEMETRY RECEIPT</p>
                <p style="font-size: 0.5rem; color: #64748B; margin-top: 2px;">${dateStr}</p>
              </div>
              <div style="font-size: 0.65rem; margin-bottom: 8px;">
                ${itemsListText}
              </div>
              <div style="border-top: 1px dashed #94A3B8; padding-top: 6px; font-size: 0.65rem;">
                <div style="display: flex; justify-content: space-between;"><span>Subtotal:</span><span>$${activeTotals.subtotal.toFixed(2)}</span></div>
                <div style="display: flex; justify-content: space-between;"><span>Shipping:</span><span>$${activeTotals.shipping.toFixed(2)}</span></div>
                <div style="display: flex; justify-content: space-between;"><span>Tax (8%):</span><span>$${activeTotals.tax.toFixed(2)}</span></div>
                <div style="display: flex; justify-content: space-between; font-weight: bold; margin-top: 4px; border-top: 1px solid #0F172A; padding-top: 4px;"><span>TOTAL (${currentMethod.toUpperCase()}):</span><span>$${calculatedGrandTotal.toFixed(2)}</span></div>
              </div>
              <div style="text-align: center; font-size: 0.5rem; color: #64748B; margin-top: 12px;">
                <p>THANK YOU FOR YOUR PATRONAGE</p>
                <p>NODE ID: #FC-9082-TR</p>
              </div>
            </div>
          `;
          thermalArea.classList.remove('hidden');

          // Clear Cart and Redirect after 5 seconds
          localStorage.removeItem('freshcart_cart');
          window.dispatchEvent(new Event('cartUpdated'));

          setTimeout(() => {
            window.location.href = 'index.html';
          }, 5000);

        }, 2000);
      };

      function showToast(message) {
        let container = document.getElementById('toast-container');
        if (!container) {
          container = document.createElement('div');
          container.id = 'toast-container';
          container.className = 'fixed bottom-8 right-8 z-50 flex flex-col gap-3 pointer-events-none';
          document.body.appendChild(container);
        }
        const toast = document.createElement('div');
        toast.className = 'market-toast pointer-events-auto transform translate-y-4 opacity-0 transition-all duration-300';
        toast.textContent = message;
        container.appendChild(toast);
        requestAnimationFrame(() => toast.classList.remove('translate-y-4', 'opacity-0'));
        setTimeout(() => {
          toast.classList.add('translate-y-4', 'opacity-0');
          setTimeout(() => toast.remove(), 400);
        }, 2500);
      }

      renderCart();
    });
  </script>
</body>
</html>
