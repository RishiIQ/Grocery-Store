<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication — FreshCart Studio</title>
  <link rel="icon" type="image/png" href="assets/images/grossary-logo.png">
  <script>
  (function() {
    // Instant Theme Init
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }

    // Instant Direction Init
    const savedDir = localStorage.getItem('dir') || 'ltr';
    document.documentElement.setAttribute('dir', savedDir);
  })();
</script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'nixon-red': '#E31837',
          }
        }
      }
    }
  </script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* ============================================
       NIXON-STYLE AUTHENTICATION PAGE
       ============================================ */
    
    html {
      perspective: 1600px;
      overflow-x: hidden;
      background: #000000;
    }

    body {
      transform-style: preserve-3d;
      overflow-x: hidden;
      animation: pageSpinZoomIn 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Incoming page animation */
    @keyframes pageSpinZoomIn {
      from {
        width: 100px;
        opacity: 0;
        transform: translateY(-200px) translateX(200px) scale(0.5);
        border-radius: 5000px;
        filter: blur(12px);
      }
      to {
        width: 100%;
        opacity: 1;
        transform: translateY(0px) translateX(0px) scale(1);
        border-radius: 0px;
        filter: blur(0px);
      }
    }

    /* Exiting page animation */
    body.cinematic-exit {
      opacity: 0;
      transform: scale(0.15) rotateZ(360deg) rotateX(30deg);
      border-radius: 100px;
      filter: blur(16px);
      transition: opacity 1.0s cubic-bezier(0.77, 0, 0.175, 1), 
                  transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), 
                  border-radius 1.0s ease,
                  filter 0.8s cubic-bezier(0.77, 0, 0.175, 1);
      pointer-events: none;
    }

    .auth-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #FFFFFF;
      position: relative;
      overflow: hidden;
      padding: 40px 20px;
      transition: background 0.5s ease;
    }

    .dark .auth-page {
      background: #000000;
    }
    
    .auth-page::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    .dark .auth-page::before {
      background-image: 
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    }
    
    /* Glow orbs */
    .auth-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      will-change: transform, opacity;
    }
    
    @keyframes orbFloatSlow {
      0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
      33% { transform: translate(50px, -30px) scale(1.1); opacity: 0.5; }
      66% { transform: translate(-30px, 40px) scale(0.9); opacity: 0.4; }
    }
    
    .auth-orb-1 {
      width: 500px;
      height: 500px;
      background: rgba(227, 24, 55, 0.08);
      top: -200px;
      right: -200px;
      animation: orbFloatSlow 10s ease-in-out infinite;
    }
    
    .auth-orb-2 {
      width: 400px;
      height: 400px;
      background: rgba(227, 24, 55, 0.05);
      bottom: -150px;
      left: -150px;
      animation: orbFloatSlow 12s ease-in-out infinite reverse;
    }
    
    /* Auth card - Nixon style */
    .auth-card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border: 1px solid #E5E5E5;
      padding: 48px 40px;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      animation: cardSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px);
    }
    
    .dark .auth-card {
      background: #1A1A1A;
      border-color: #333333;
    }
    
    @keyframes cardSlideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: #E31837;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .auth-card:hover::before {
      transform: scaleX(1);
    }
    
    /* Nixon typography */
    .nixon-heading {
      font-family: 'Arial Black', 'Impact', sans-serif;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 0.95;
    }
    
    .nixon-subheading {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      font-weight: 700;
    }
   
    /* Logo */
    .auth-logo {
      font-family: 'Arial Black', 'Impact', sans-serif;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      color: #000000;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    
    .dark .auth-logo {
      color: #FFFFFF;
    }
    
    .auth-logo .red {
      color: #E31837;
    }
    
    .auth-logo .badge {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.5rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #8A8A8A;
      padding: 2px 8px;
      border: 1px solid #E5E5E5;
    }
    
    .dark .auth-logo .badge {
      border-color: #333333;
    }
    
    /* Form inputs - Nixon style */
    .nixon-input {
      width: 100%;
      padding: 16px 20px;
      background: transparent;
      border: 1px solid #E5E5E5;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #000000;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
    }
    
    .dark .nixon-input {
      border-color: #333333;
      color: #FFFFFF;
    }
    
    .nixon-input::placeholder {
      color: #8A8A8A;
      font-weight: 400;
      letter-spacing: 0.1em;
    }
    
    .nixon-input:focus {
      border-color: #E31837;
      box-shadow: 0 0 0 3px rgba(227, 24, 55, 0.1);
    }
    
    .nixon-input.error {
      border-color: #E31837;
      animation: shake 0.4s ease;
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    
    .nixon-label {
      display: block;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #8A8A8A;
      margin-bottom: 6px;
    }
    
    /* Password toggle */
    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #8A8A8A;
      padding: 4px;
      transition: all 0.3s ease;
    }
    
    .password-toggle:hover {
      color: #E31837;
    }
    
    .password-toggle svg {
      width: 20px;
      height: 20px;
      transition: all 0.3s ease;
    }
    
    /* Nixon button */
    .nixon-btn {
      display: inline-block;
      padding: 18px 40px;
      background: #E31837;
      color: #FFFFFF;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      border: none;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      width: 100%;
    }
    
    .nixon-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.6s ease;
    }
    
    .nixon-btn:hover::before {
      left: 100%;
    }
    
    .nixon-btn:hover {
      background: #C41230;
      transform: scale(1.02);
    }
    
    .nixon-btn:active {
      transform: scale(0.98);
    }
    
    .nixon-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
    }
    
    /* Toggle mode button */
    .toggle-mode-btn {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #8A8A8A;
      background: none;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
      padding: 8px 0;
    }
    
    .toggle-mode-btn:hover {
      color: #E31837;
    }
    
    /* Divider */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 20px 0;
    }
    
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #E5E5E5;
    }
    
    .dark .auth-divider::before,
    .dark .auth-divider::after {
      background: #333333;
    }
    
    .auth-divider span {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.55rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #8A8A8A;
    }
    
    /* Social login buttons */
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      background: transparent;
      border: 1px solid #E5E5E5;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #000000;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .dark .social-btn {
      border-color: #333333;
      color: #FFFFFF;
    }
    
    .social-btn:hover {
      border-color: #E31837;
      color: #E31837;
      transform: translateY(-2px);
    }
    
    .social-btn .icon {
      font-size: 1.2rem;
    }
    
    /* Theme toggle buttons - Nixon style */
    .theme-toggle-btn {
      width: 36px;
      height: 36px;
      border: 1px solid #E5E5E5;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000000;
      transition: all 0.3s ease;
      border-radius: 50%;
    }
    
    .dark .theme-toggle-btn {
      border-color: #333333;
      color: #FFFFFF;
    }
    
    .theme-toggle-btn:hover {
      border-color: #E31837;
      color: #E31837;
    }
    
    /* Loading spinner */
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-white dark:bg-[#0A0A0A] text-slate-900 dark:text-white transition-colors duration-500">

  <!-- ============================================ -->
  <!-- AUTH PAGE -->
  <!-- ============================================ -->
  <div class="auth-page">
    
    <!-- Glow Orbs -->
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>

    <!-- ========================================== -->
    <!-- AUTH CARD -->
    <!-- ========================================== -->
    <div class="auth-card">

      <!-- Top Right: Theme & RTL -->
      <div class="flex justify-end gap-2 mb-6">
        <button id="rtlToggle" class="theme-toggle-btn" title="Toggle Text Direction">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6h12M6 12h8M6 18h10"/>
          </svg>
        </button>
        <button id="themeToggle" class="theme-toggle-btn" title="Toggle Theme">
          <svg class="dark:hidden" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
          </svg>
          <svg class="hidden dark:block text-[#F5A623]" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
          </svg>
        </button>
      </div>

      <!-- Brand with Asset Image Logo in Front -->
      <div class="text-center mb-8">
        <a href="index.html" class="auth-logo">
          <div class="w-8 h-8 overflow-hidden flex items-center justify-center rounded-sm">
            <img src="assets/images/grossary-logo.png" alt="Logo" class="w-full h-full object-contain">
          </div>
          <span>Fresh<span class="red">Cart</span></span>
          
        </a>
        <h1 id="formTitle" class="nixon-heading text-3xl mt-4">Member Login</h1>
        <p id="formSubtitle" class="nixon-body text-sm mt-2">Access your private reserve and dispatch bag</p>
      </div>

      <!-- ========================================== -->
      <!-- AUTH FORM -->
      <!-- ========================================== -->
      <form id="authForm" novalidate>
        
        <!-- Name Field (Sign Up only) -->
        <div id="nameFieldContainer" class="space-y-2 hidden">
          <label class="nixon-label" for="fullName">Full Name</label>
          <input 
            type="text" 
            id="fullName" 
            placeholder="JUSTIN MASON" 
            class="nixon-input"
            autocomplete="name"
          >
        </div>

        <!-- Email -->
        <div class="space-y-2">
          <label class="nixon-label" for="email">Email Address</label>
          <input 
            type="email" 
            id="email" 
            placeholder="JUSTIN@EXAMPLE.COM" 
            class="nixon-input"
            autocomplete="email"
            required
          >
        </div>

        <!-- Password -->
        <div class="space-y-2">
          <label class="nixon-label" for="password">Password</label>
          <div class="relative">
            <input 
              type="password" 
              id="password" 
              placeholder="••••••••" 
              class="nixon-input pr-14"
              autocomplete="current-password"
              required
              minlength="6"
            >
            <button 
              type="button" 
              id="passwordToggle" 
              class="password-toggle"
              aria-label="Toggle password visibility"
            >
              <!-- Eye Open -->
              <svg id="eyeOpen" class="block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
              <!-- Eye Closed -->
              <svg id="eyeClosed" class="hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Forgot Password -->
        <div class="text-right">
          <a href="#" class="text-[0.5rem] font-bold tracking-[0.15em] uppercase text-[#8A8A8A] hover:text-[#E31837] transition-colors">
            Forgot password?
          </a>
        </div>

        <!-- Submit -->
        <button type="submit" id="submitBtn" class="nixon-btn mt-4">
          <span id="btnText">Authorize Session →</span>
          <span id="btnLoading" class="hidden">
            <span class="spinner" style="display: inline-block;"></span>
            Processing...
          </span>
        </button>

        <!-- Divider -->
        <div class="auth-divider">
          <span>or continue with</span>
        </div>

        <!-- Social Login -->
        <div class="grid grid-cols-2 gap-3">
          <button type="button" class="social-btn" onclick="socialLogin('Google')">
            <span class="icon flex items-center justify-center w-5 h-5">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.24v3.15C3.25 21.32 7.32 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.5-.38-2.25s.13-1.53.38-2.25V6.6H1.24C.45 8.18 0 9.98 0 12s.45 3.82 1.24 5.4l4.04-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.32 0 3.25 2.68 1.24 6.6l4.04 3.15c.95-2.84 3.6-4.95 6.72-4.95z"/>
              </svg>
            </span>
            Google
          </button>
          <button type="button" class="social-btn" onclick="socialLogin('Apple')">
            <span class="icon flex items-center justify-center w-5 h-5">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.45c.57-.69 0.96-1.65.85-2.61-.84.04-1.86.56-2.45 1.25-.53.61-.99 1.59-.87 2.54.94.07 1.89-.47 2.47-1.18z"/>
              </svg>
            </span>
            Apple
          </button>
        </div>

      </form>

      <!-- Toggle Mode -->
      <div class="mt-6 pt-6 border-t border-[#E5E5E5] dark:border-[#333333] text-center">
        <button type="button" id="toggleModeBtn" class="toggle-mode-btn">
          Need an account? Sign Up →
        </button>
      </div>

    </div>

    <!-- Footer -->
    <div class="relative z-10 mt-8 text-center">
      <p class="text-[0.5rem] font-bold tracking-[0.2em] uppercase text-[#8A8A8A]">
        🔒 Encrypted TLS 256-Bit Protocol • © 2026 FreshCart
      </p>
    </div>

  </div>

  <!-- ============================================ -->
  <!-- SCRIPTS -->
  <!-- ============================================ -->
  <script src="js/db.js"></script>

  <script>
    // ==========================================
    // 1. AUTH STATE
    // ==========================================
    let isSignUp = false;

    // ==========================================
    // 2. PASSWORD TOGGLE
    // ==========================================
    const passwordToggle = document.getElementById('passwordToggle');
    const passwordInput = document.getElementById('password');
    const eyeOpen = document.getElementById('eyeOpen');
    const eyeClosed = document.getElementById('eyeClosed');

    passwordToggle.addEventListener('click', function() {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeOpen.classList.toggle('hidden');
      eyeClosed.classList.toggle('hidden');
    });

    // ==========================================
    // 3. TOGGLE AUTH MODE
    // ==========================================
    const toggleModeBtn = document.getElementById('toggleModeBtn');
    const formTitle = document.getElementById('formTitle');
    const formSubtitle = document.getElementById('formSubtitle');
    const nameContainer = document.getElementById('nameFieldContainer');
    const fullNameInput = document.getElementById('fullName');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    toggleModeBtn.addEventListener('click', function() {
      isSignUp = !isSignUp;
      
      if (isSignUp) {
        formTitle.textContent = 'Create Account';
        formSubtitle.textContent = 'Register for member privileges and $10 voucher';
        nameContainer.classList.remove('hidden');
        fullNameInput.setAttribute('required', 'true');
        btnText.textContent = 'Register Account →';
        toggleModeBtn.textContent = 'Already have an account? Login →';
        document.querySelector('.auth-logo .badge').textContent = 'SIGN UP';
        document.querySelector('.auth-card').style.animation = 'none';
        setTimeout(() => {
          document.querySelector('.auth-card').style.animation = 'cardSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards';
        }, 10);
        showToast('📝 Switch to Sign Up mode');
      } else {
        formTitle.textContent = 'Member Login';
        formSubtitle.textContent = 'Access your private reserve and dispatch bag';
        nameContainer.classList.add('hidden');
        fullNameInput.removeAttribute('required');
        btnText.textContent = 'Authorize Session →';
        toggleModeBtn.textContent = 'Need an account? Sign Up →';
        document.querySelector('.auth-logo .badge').textContent = 'PRO';
        document.querySelector('.auth-card').style.animation = 'none';
        setTimeout(() => {
          document.querySelector('.auth-card').style.animation = 'cardSlideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards';
        }, 10);
        showToast('🔐 Switch to Login mode');
      }
    });

    // ==========================================
    // 4. FORM SUBMISSION
    // ==========================================
    const authForm = document.getElementById('authForm');
    const btnLoading = document.getElementById('btnLoading');

    authForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      let isValid = true;
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email.value.trim() || !emailRegex.test(email.value.trim())) {
        email.classList.add('error');
        isValid = false;
        showToast('⚠️ Please enter a valid email address');
      } else {
        email.classList.remove('error');
      }
      
      if (!password.value.trim() || password.value.length < 6) {
        password.classList.add('error');
        isValid = false;
        showToast('⚠️ Password must be at least 6 characters');
      } else {
        password.classList.remove('error');
      }
      
      if (isSignUp) {
        const name = document.getElementById('fullName');
        if (!name.value.trim() || name.value.length < 2) {
          name.classList.add('error');
          isValid = false;
          showToast('⚠️ Please enter your full name');
        } else {
          name.classList.remove('error');
        }
      }
      
      if (!isValid) return;
      
      btnText.classList.add('hidden');
      btnLoading.classList.remove('hidden');
      submitBtn.disabled = true;
      
      setTimeout(() => {
        const name = isSignUp ? document.getElementById('fullName').value : email.value.split('@')[0];
        localStorage.setItem('freshcart_user', JSON.stringify({ 
          email: email.value.trim(), 
          name: name 
        }));
        
        btnText.classList.remove('hidden');
        btnLoading.classList.add('hidden');
        submitBtn.disabled = false;
        
        showToast(isSignUp ? '✅ Account created successfully!' : '✅ Welcome back!');
        
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1200);
      }, 1500);
    });

    // ==========================================
    // 5. SOCIAL LOGIN
    // ==========================================
    window.socialLogin = function(provider) {
      showToast(`🔑 ${provider} authentication coming soon`);
    };

    // ==========================================
    // 6. THEME TOGGLE
    // ==========================================
    document.getElementById('themeToggle').addEventListener('click', function() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      showToast(isDark ? '🌙 Dark mode enabled' : '☀️ Light mode enabled');
    });

    // ==========================================
    // 7. RTL TOGGLE
    // ==========================================
    const rtlBtn = document.getElementById('rtlToggle');
    const savedDir = localStorage.getItem('dir') || 'ltr';
    
    const updateRtlIcon = (dir) => {
      rtlBtn.innerHTML = dir === 'rtl'
        ? `<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6h12M10 12h8M8 18h10"/></svg>`
        : `<svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 6h12M6 12h8M6 18h10"/></svg>`;
    };
    updateRtlIcon(savedDir);
    
    rtlBtn.addEventListener('click', function() {
      const currentDir = document.documentElement.getAttribute('dir');
      const newDir = currentDir === 'rtl' ? 'ltr' : 'rtl';
      document.documentElement.setAttribute('dir', newDir);
      localStorage.setItem('dir', newDir);
      updateRtlIcon(newDir);
      showToast(newDir === 'rtl' ? '📖 RTL mode enabled' : '📖 LTR mode enabled');
    });

    // ==========================================
    // 8. PAGE SWITCHING INTERCEPTOR FOR LOGIN
    // ==========================================
    document.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      
      if (
        link &&
        link.href &&
        link.hostname === window.location.hostname &&
        !link.getAttribute('target') &&
        !link.getAttribute('download') &&
        link.getAttribute('href') !== '#' &&
        !link.getAttribute('href').startsWith('javascript') &&
        !link.getAttribute('href').startsWith('#')
      ) {
        e.preventDefault();
        const targetUrl = link.href;

        document.body.classList.add('cinematic-exit');

        setTimeout(() => {
          window.location.href = targetUrl;
        }, 1000);
      }
    });

    // ==========================================
    // 9. TOAST FUNCTION
    // ==========================================
    function showToast(message) {
      let container = document.getElementById('toast-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'toast-container';
        container.className = 'fixed bottom-8 right-8 z-50 flex flex-col gap-3 pointer-events-none';
        document.body.appendChild(container);
      }
      
      const toast = document.createElement('div');
      toast.className = 'pointer-events-auto bg-black text-white dark:bg-white dark:text-black px-6 py-4 text-sm font-bold tracking-[0.15em] uppercase shadow-2xl border border-[#333333] dark:border-[#E5E5E5] transform translate-y-4 opacity-0 transition-all duration-300';
      toast.textContent = message;
      container.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-4', 'opacity-0');
      });
      
      setTimeout(() => {
        toast.classList.add('translate-y-4', 'opacity-0');
        setTimeout(() => toast.remove(), 400);
      }, 3000);
    }

    // ==========================================
    // 10. REMOVE ERROR STATE ON INPUT
    // ==========================================
    document.querySelectorAll('.nixon-input').forEach(input => {
      input.addEventListener('input', function() {
        this.classList.remove('error');
      });
    });

    // ==========================================
    // 11. INITIALIZE RTL
    // ==========================================
    if (savedDir === 'rtl') {
      document.documentElement.setAttribute('dir', 'rtl');
    }

  </script>

</body>
</html>
