<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance — FreshCart Botanical Studio</title>
  <link rel="icon" type="image/png" href="assets/images/grossary-logo.png">
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      const savedDir = localStorage.getItem('dir') || 'ltr';
      document.documentElement.setAttribute('dir', savedDir);
      
      // Disable page animation
      document.documentElement.style.animation = 'none';
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'sage-accent': '#6A8071',
            'sage-dark': '#24302A',
            'cream-bg': '#F7F6F2',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* ============================================
       MAINTENANCE PAGE STYLES
       ============================================ */
    
    /* Disable animations on maintenance page */
    html, body {
      animation: none !important;
      transform: none !important;
      opacity: 1 !important;
      filter: none !important;
      perspective: none !important;
    }
    
    body {
      animation: none !important;
      transform: none !important;
      opacity: 1 !important;
      filter: none !important;
      overflow-x: hidden;
      background: #F7F6F2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .dark body {
      background: #111814;
    }
    
    body.cinematic-exit {
      display: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    
    /* ============================================
       MAINTENANCE CONTAINER
       ============================================ */
    .maintenance-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 20px 80px;
      min-height: 100vh;
    }
    
    .maintenance-content {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
      text-align: center;
    }
    
    /* ============================================
       ANIMATED ILLUSTRATION
       ============================================ */
    .maintenance-illustration {
      position: relative;
      width: 300px;
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Pulsing Ring */
    .pulse-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid #6A8071;
      opacity: 0;
      animation: pulseRing 2.5s ease-out infinite;
    }
    
    .pulse-ring:nth-child(1) {
      width: 100%;
      height: 100%;
      animation-delay: 0s;
    }
    
    .pulse-ring:nth-child(2) {
      width: 70%;
      height: 70%;
      animation-delay: 0.5s;
    }
    
    .pulse-ring:nth-child(3) {
      width: 40%;
      height: 40%;
      animation-delay: 1s;
    }
    
    @keyframes pulseRing {
      0% {
        transform: scale(0.5);
        opacity: 0.8;
      }
      100% {
        transform: scale(1.5);
        opacity: 0;
      }
    }
    
    /* Center Icon */
    .center-icon {
      position: relative;
      z-index: 10;
      width: 120px;
      height: 120px;
      background: #6A8071;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 60px rgba(106, 128, 113, 0.3);
      animation: floatIcon 3s ease-in-out infinite;
    }
    
    .dark .center-icon {
      box-shadow: 0 20px 60px rgba(106, 128, 113, 0.15);
    }
    
    @keyframes floatIcon {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px);
      }
    }
    
    .center-icon .icon-inner {
      font-size: 3.5rem;
      animation: spinIcon 8s linear infinite;
    }
    
    @keyframes spinIcon {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
    
    /* Floating particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      background: #6A8071;
      opacity: 0.3;
      animation: floatParticle 4s ease-in-out infinite;
    }
    
    .particle:nth-child(1) {
      width: 12px;
      height: 12px;
      top: 5%;
      right: 10%;
      animation-delay: 0s;
    }
    
    .particle:nth-child(2) {
      width: 8px;
      height: 8px;
      bottom: 15%;
      right: 5%;
      animation-delay: 1s;
    }
    
    .particle:nth-child(3) {
      width: 16px;
      height: 16px;
      bottom: 10%;
      left: 5%;
      animation-delay: 2s;
    }
    
    .particle:nth-child(4) {
      width: 10px;
      height: 10px;
      top: 15%;
      left: 8%;
      animation-delay: 1.5s;
    }
    
    .particle:nth-child(5) {
      width: 6px;
      height: 6px;
      top: 45%;
      right: 0%;
      animation-delay: 2.5s;
    }
    
    @keyframes floatParticle {
      0%, 100% {
        transform: translate(0, 0) scale(1);
        opacity: 0.2;
      }
      50% {
        transform: translate(15px, -20px) scale(1.5);
        opacity: 0.6;
      }
    }
    
    /* ============================================
       TEXT CONTENT
       ============================================ */
    .maintenance-title {
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      font-size: 3.5rem;
      line-height: 1.1;
      color: #0F172A;
    }
    
    .dark .maintenance-title {
      color: #FFFFFF;
    }
    
    .maintenance-title .highlight {
      color: #6A8071;
    }
    
    .maintenance-subtitle {
      font-size: 1.1rem;
      line-height: 1.8;
      color: #64748B;
      max-width: 500px;
      margin: 0 auto;
    }
    
    .dark .maintenance-subtitle {
      color: #94A3B8;
    }
    
    .maintenance-subtitle .emoji {
      font-style: normal;
    }
    
    /* ============================================
       PROGRESS BAR
       ============================================ */
    .progress-container {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }
    
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #E2E8F0;
      border-radius: 0px;
      overflow: hidden;
      position: relative;
    }
    
    .dark .progress-bar {
      background: #2D3E35;
    }
    
    .progress-bar .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6A8071, #8FA89B);
      width: 0%;
      border-radius: 0px;
      animation: progressFill 3s ease-in-out infinite;
    }
    
    @keyframes progressFill {
      0% {
        width: 0%;
      }
      50% {
        width: 65%;
      }
      100% {
        width: 85%;
      }
    }
    
    .progress-label {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #94A3B8;
    }
    
    /* ============================================
       STATUS DOTS
       ============================================ */
    .status-dots {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }
    
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #E2E8F0;
      transition: all 0.3s ease;
    }
    
    .dark .status-dot {
      background: #2D3E35;
    }
    
    .status-dot.active {
      background: #6A8071;
      animation: dotPulse 1.5s ease-in-out infinite;
    }
    
    .status-dot.active:nth-child(2) {
      animation-delay: 0.3s;
    }
    
    .status-dot.active:nth-child(3) {
      animation-delay: 0.6s;
    }
    
    @keyframes dotPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.5);
        opacity: 0.5;
      }
    }
    
    .status-text {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #94A3B8;
      margin-left: 4px;
    }
    
    /* ============================================
       ACTION BUTTONS
       ============================================ */
    .maintenance-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      margin-top: 8px;
    }
    
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 36px;
      background: #6A8071;
      color: #FFFFFF;
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      border: none;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      border-radius: 0px;
    }
    
    .btn-primary:hover {
      background: #576B5D;
      transform: scale(1.02);
      box-shadow: 0 8px 30px rgba(106, 128, 113, 0.3);
    }
    
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 36px;
      background: transparent;
      color: #0F172A;
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      border: 2px solid #0F172A;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      border-radius: 0px;
    }
    
    .dark .btn-secondary {
      color: #FFFFFF;
      border-color: #FFFFFF;
    }
    
    .btn-secondary:hover {
      background: #6A8071;
      color: #FFFFFF;
      border-color: #6A8071;
      transform: scale(1.02);
    }
    
    /* ============================================
       SOCIAL LINKS
       ============================================ */
    .social-links {
      display: flex;
      gap: 16px;
      justify-content: center;
      margin-top: 8px;
    }
    
    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid #E2E8F0;
      color: #64748B;
      transition: all 0.3s ease;
      text-decoration: none;
      border-radius: 0px;
    }
    
    .dark .social-link {
      border-color: #2D3E35;
      color: #94A3B8;
    }
    
    .social-link:hover {
      border-color: #6A8071;
      color: #6A8071;
      transform: translateY(-3px);
    }
    
    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 768px) {
      .maintenance-container {
        padding: 100px 16px 60px;
      }
      
      .maintenance-illustration {
        width: 220px;
        height: 220px;
      }
      
      .center-icon {
        width: 90px;
        height: 90px;
      }
      
      .center-icon .icon-inner {
        font-size: 2.5rem;
      }
      
      .maintenance-title {
        font-size: 2.5rem;
      }
      
      .maintenance-subtitle {
        font-size: 1rem;
        padding: 0 10px;
      }
      
      .pulse-ring {
        border-width: 1.5px;
      }
      
      .maintenance-actions {
        flex-direction: column;
        width: 100%;
      }
      
      .maintenance-actions .btn-primary,
      .maintenance-actions .btn-secondary {
        width: 100%;
        justify-content: center;
      }
    }
    
    @media (max-width: 480px) {
      .maintenance-container {
        padding: 80px 12px 40px;
      }
      
      .maintenance-illustration {
        width: 180px;
        height: 180px;
      }
      
      .center-icon {
        width: 70px;
        height: 70px;
      }
      
      .center-icon .icon-inner {
        font-size: 2rem;
      }
      
      .maintenance-title {
        font-size: 1.8rem;
      }
      
      .maintenance-subtitle {
        font-size: 0.9rem;
      }
      
      .particle {
        display: none;
      }
      
      .social-links {
        gap: 12px;
      }
      
      .social-link {
        width: 36px;
        height: 36px;
      }
    }
    
    /* ============================================
       DARK MODE ADJUSTMENTS
       ============================================ */
    .dark .center-icon {
      background: #4A6A58;
    }
    
    .dark .progress-fill {
      background: linear-gradient(90deg, #4A6A58, #6A8A78);
    }
    
    /* ============================================
       TOAST
       ============================================ */
    .market-toast {
      background: #24302A;
      color: #FFFFFF;
      padding: 14px 24px;
      border-radius: 0px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      border-left: 4px solid #6A8071;
    }
  </style>
</head>
<body>

  <!-- ============================================ -->
  <!-- MAINTENANCE CONTENT -->
  <!-- ============================================ -->
  <main>
    <div class="maintenance-container">
      <div class="maintenance-content">
        
        <!-- Animated Illustration -->
        <div class="maintenance-illustration">
          <!-- Pulse Rings -->
          <div class="pulse-ring"></div>
          <div class="pulse-ring"></div>
          <div class="pulse-ring"></div>
          
          <!-- Floating Particles -->
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          <div class="particle"></div>
          
          <!-- Center Icon -->
          <div class="center-icon">
            <span class="icon-inner">🔧</span>
          </div>
        </div>

        <!-- Title -->
        <h1 class="maintenance-title">
          We're <span class="highlight">Tuning</span> Up
        </h1>

        <!-- Subtitle -->
        <p class="maintenance-subtitle">
          <span class="emoji">🌱</span> Our botanical studio is currently undergoing scheduled maintenance. 
          We'll be back with fresh improvements soon!
        </p>

        <!-- Status Dots -->
        <div class="status-dots">
          <span class="status-dot active"></span>
          <span class="status-dot active"></span>
          <span class="status-dot active"></span>
          <span class="status-text">System Update in Progress</span>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container">
          <div class="progress-bar">
            <div class="progress-fill"></div>
          </div>
          <div class="progress-label">
            <span>Updating</span>
            <span id="progressPercentage">85%</span>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="maintenance-actions">
          <a href="index.html" class="btn-primary">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1m-2 0h2"/>
            </svg>
            Check Status
          </a>
          <a href="contact.html" class="btn-secondary">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
            </svg>
            Contact Support
          </a>
        </div>
    </div>
  </main>

  <!-- ============================================ -->
  <!-- SCRIPTS -->
 
  <script src="js/db.js"></script>
  <!-- <script src="js/layout.js"></script> -->

  <script>
    (function() {
      'use strict';
      
      // Disable body animation
      document.body.style.animation = 'none';
      document.body.style.transform = 'none';
      document.body.style.opacity = '1';
      document.body.style.filter = 'none';

      // ============================================
      // DYNAMIC PROGRESS
      // ============================================
      const progressFill = document.querySelector('.progress-fill');
      const progressLabel = document.getElementById('progressPercentage');
      
      if (progressFill && progressLabel) {
        let progress = 0;
        const targetProgress = 92;
        const increment = 0.5;
        
        function updateProgress() {
          if (progress < targetProgress) {
            progress += increment;
            if (progress > targetProgress) {
              progress = targetProgress;
            }
            progressFill.style.width = progress + '%';
            progressLabel.textContent = Math.round(progress) + '%';
            
            // Slower progress at the end
            const delay = progress > 80 ? 800 : 200;
            setTimeout(updateProgress, delay);
          }
        }
        
        // Start progress after a short delay
        setTimeout(updateProgress, 500);
      }

      // ============================================
      // ETA COUNTDOWN
      // ============================================
      const etaElement = document.getElementById('etaTime');
      if (etaElement) {
        let minutes = 15;
        
        function updateETA() {
          if (minutes > 0) {
            minutes--;
            etaElement.textContent = minutes + ' minutes';
            setTimeout(updateETA, 60000);
          } else {
            etaElement.textContent = 'Any moment now!';
          }
        }
        
        setTimeout(updateETA, 60000);
      }

      // ============================================
      // TOAST NOTIFICATION
      // ============================================
      function showToast(message) {
        let container = document.getElementById('toast-container');
        if (!container) {
          container = document.createElement('div');
          container.id = 'toast-container';
          container.className = 'fixed bottom-8 right-8 z-50 flex flex-col gap-3 pointer-events-none';
          document.body.appendChild(container);
        }
        
        const toast = document.createElement('div');
        toast.className = 'market-toast pointer-events-auto transform translate-y-4 opacity-0 transition-all duration-300';
        toast.textContent = message;
        container.appendChild(toast);
        
        requestAnimationFrame(function() {
          toast.classList.remove('translate-y-4', 'opacity-0');
        });
        
        setTimeout(function() {
          toast.classList.add('translate-y-4', 'opacity-0');
          setTimeout(function() { toast.remove(); }, 400);
        }, 2500);
      }

      // ============================================
      // COPYRIGHT YEAR
      // ============================================
      const yearElement = document.querySelector('.nixon-footer-bottom p');
      if (yearElement) {
        const currentYear = new Date().getFullYear();
        yearElement.textContent = '© ' + currentYear + ' FreshCart Marketplace. All rights reserved.';
      }

      console.log('🔧 Maintenance page loaded successfully');
    })();
  </script>

</body>
</html>
