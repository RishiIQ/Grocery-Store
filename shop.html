<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/images/grossary-logo.png">
  <title>Artisanal Harvest — FreshCart Marketplace</title>
  <script>
  (function() {
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    const savedDir = localStorage.getItem('dir') || 'ltr';
    document.documentElement.setAttribute('dir', savedDir);
  })();
</script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'sage-accent': '#6A8071',
            'sage-dark': '#24302A',
            'cream-bg': '#F7F6F2',
          }
        }
      }
    }
  </script>
  
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* ============================================
       SAGE & EARTH-TONE 3D COVERFLOW STAGE
       ============================================ */
    .tunnel-stage {
      perspective: 1600px;
      transform-style: preserve-3d;
      background: #24302A;
      overflow: hidden;
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .dark .tunnel-stage {
      background: #111814;
    }

    #tunnelStack {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%);
      transform-style: preserve-3d;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .tunnel-card-wrapper {
      position: absolute;
      width: 420px;
      max-width: 85vw;
      transform-style: preserve-3d;
      will-change: transform, opacity;
      pointer-events: none;
    }
    
    .tunnel-card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 0px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.2);
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
      pointer-events: auto;
      cursor: pointer;
      overflow: hidden;
    }
    
    .dark .tunnel-card {
      background: #18221D;
      border-color: #2D3E35;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    }
    
    .tunnel-card-content {
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 20px;
      transform: translateZ(0);
    }
    
    @media (max-width: 768px) {
      .tunnel-card-wrapper {
        width: 300px;
      }
      .tunnel-card-content {
        padding: 16px;
        gap: 12px;
      }
      .tunnel-stage {
        perspective: 1000px;
      }
    }
    
    .tunnel-image-wrap {
      width: 100%;
      aspect-ratio: 1/1;
      overflow: hidden;
      position: relative;
      border-radius: 0px;
    }
    
    .tunnel-image-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .tunnel-card:hover .tunnel-image-wrap img {
      transform: scale(1.06);
    }
    
    .market-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: #6A8071;
      color: #FFFFFF;
      font-size: 0.55rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 6px 14px;
      border-radius: 0px;
      z-index: 10;
    }
    
    .tunnel-info h3 {
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1.1;
      font-size: 1.25rem;
    }
    
    .glow-orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(100px);
      will-change: transform, opacity;
    }
    
    .orb-1 {
      width: 500px;
      height: 500px;
      background: rgba(106, 128, 113, 0.15);
      top: -100px;
      right: -100px;
    }
    
    .orb-2 {
      width: 400px;
      height: 400px;
      background: rgba(106, 128, 113, 0.1);
      bottom: -100px;
      left: -100px;
    }
    
    #tunnelProgressBar {
      height: 4px;
      background: #6A8071;
      width: 0%;
      position: fixed;
      top: 70px;
      left: 0;
      z-index: 100;
      box-shadow: 0 0 20px rgba(106, 128, 113, 0.3);
    }
    
    .market-section-title {
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    
    .market-section-subtitle {
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: #6A8071;
      font-weight: 700;
    }
    
    .market-btn-small {
      text-transform: uppercase;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      padding: 10px 22px;
      background: #24302A;
      color: #FFFFFF;
      border: none;
      border-radius: 0px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }
    
    .dark .market-btn-small {
      background: #FFFFFF;
      color: #24302A;
    }

    .market-btn-small:hover {
      background: #6A8071;
      color: #FFFFFF;
      transform: scale(1.03);
    }
    
    .scroll-hint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      background: rgba(36, 48, 42, 0.8);
      padding: 8px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      z-index: 10;
      pointer-events: none;
    }

    .market-toast {
      background: #24302A;
      color: #FFFFFF;
      padding: 14px 24px;
      border-radius: 0px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      border-left: 4px solid #6A8071;
    }
  </style>
</head>
<body class="bg-cream-bg dark:bg-[#111814] text-slate-900 dark:text-slate-100 antialiased">

  <div id="tunnelProgressBar"></div>

  <main style="padding-top: 70px;">

    <!-- PAGE HEADER -->
    <section class="py-16 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto text-center border-b border-slate-200 dark:border-[#2D3E35]">
      <p class="market-section-subtitle">🌿 Botanical Archive</p>
      <h1 class="market-section-title text-4xl sm:text-5xl lg:text-6xl mt-2">Artisanal Harvest Showcase</h1>
      <div class="w-12 h-1 bg-[#6A8071] mx-auto mt-4"></div>
      <p class="text-slate-600 dark:text-slate-400 text-sm mt-4 max-w-xl mx-auto leading-relaxed">
        Navigate our decentralized organic inventory across a horizontal 3D perspective row. Select any parcel to inspect direct farm-gate specifications.
      </p>
    </section>

    <!-- HORIZONTAL 3D COVERFLOW SECTION (ALL PRODUCTS) -->
    <section id="tunnelScrollContainer" class="relative h-[900vh]">
      <div class="sticky top-0 h-screen w-full overflow-hidden tunnel-stage" id="tunnelStage">
        
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>

        <div id="tunnelStack"></div>

        <div class="scroll-hint">↓ Scroll to explore botanical catalog ↓</div>

      </div>
    </section>

  </main>

  <script src="js/db.js"></script>
  <script src="js/layout.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const checkDB = setInterval(() => {
        if (window.FreshCartDB && window.FreshCartDB.products) {
          clearInterval(checkDB);
          initShopCoverflow();
        }
      }, 50);

      setTimeout(() => clearInterval(checkDB), 3000);

      function initShopCoverflow() {
        const tunnelStack = document.getElementById('tunnelStack');
        const tunnelContainer = document.getElementById('tunnelScrollContainer');
        const progressBar = document.getElementById('tunnelProgressBar');
        
        const products = window.FreshCartDB.products;

        if (tunnelStack && products.length > 0) {
          tunnelStack.innerHTML = products.map((p, i) => `
            <div class="tunnel-card-wrapper" data-index="${i}">
              <div class="tunnel-card" onclick="window.location.href='product-detail.html?id=${p.id}'">
                <div class="tunnel-card-content">
                  <div class="tunnel-image-wrap block">
                    <span class="market-badge">${p.badge || 'Organic'}</span>
                    <img src="${p.image}" alt="${p.name}" loading="lazy">
                  </div>
                  <div class="tunnel-info">
                    <div>
                      <span class="text-xs font-bold tracking-[0.2em] uppercase text-[#6A8071]">Parcel ${String(i + 1).padStart(2, '0')}</span>
                      <h3 class="mt-1">${p.name}</h3>
                      <p class="text-xs text-slate-600 dark:text-slate-400 leading-relaxed mt-1 line-clamp-2">${p.description}</p>
                    </div>
                    <div class="pt-3 border-t border-slate-200 dark:border-[#2D3E35] flex justify-between items-center gap-4">
                      <span class="font-extrabold text-xl">$${p.price.toFixed(2)}</span>
                      <div class="flex items-center gap-2">
                        <a href="product-detail.html?id=${p.id}" class="market-btn-small" style="background: transparent; color: inherit; border: 1px solid currentColor;">Inspect</a>
                        <button onclick="event.stopPropagation(); handleAddToCart('${p.id}')" class="market-btn-small">Add</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          `).join('');

          const wrappers = tunnelStack.querySelectorAll('.tunnel-card-wrapper');
          const cards = tunnelStack.querySelectorAll('.tunnel-card');

          let ticking = false;

          function updateTunnel() {
            const rect = tunnelContainer.getBoundingClientRect();
            const totalHeight = tunnelContainer.offsetHeight - window.innerHeight;
            let progress = -rect.top / totalHeight;
            progress = Math.max(0, Math.min(1, progress));

            if (progressBar) {
              progressBar.style.width = `${progress * 100}%`;
            }

            const totalCards = wrappers.length;
            
            wrappers.forEach((wrapper, index) => {
              const card = cards[index];
              if (!card) return;

              const cardTargetProgress = index / Math.max(1, (totalCards - 1));
              const distance = progress - cardTargetProgress;

              const spacing = window.innerWidth <= 768 ? 220 : 380;
              const translateX = distance * spacing * -1;
              const translateZ = -Math.abs(distance) * 450;
              const rotateY = distance * 60;
              const scale = Math.max(0.55, 1 - Math.abs(distance) * 0.4);
              const opacity = Math.max(0.1, 1 - Math.abs(distance) * 1.6);
              const blurAmount = Math.abs(distance) * 12;
              const zIndex = Math.round(100 - Math.abs(distance) * 10);

              wrapper.style.transform = `translate3d(${translateX}px, 0, ${translateZ}px) rotateY(${rotateY}deg) scale(${scale})`;
              wrapper.style.zIndex = zIndex;
              
              card.style.opacity = opacity;
              card.style.filter = `blur(${blurAmount}px)`;

              if (Math.abs(distance) < 0.3) {
                wrapper.style.pointerEvents = 'auto';
                card.style.pointerEvents = 'auto';
              } else {
                wrapper.style.pointerEvents = 'none';
                card.style.pointerEvents = 'none';
              }
            });

            ticking = false;
          }

          window.addEventListener('scroll', () => {
            if (!ticking) {
              requestAnimationFrame(updateTunnel);
              ticking = true;
            }
          }, { passive: true });

          updateTunnel();
        }
      }

      window.handleAddToCart = function(productId) {
        if (window.FreshCartDB) {
          window.FreshCartDB.addToCart(productId);
          if (window.NixonLayout && window.NixonLayout.updateCartBadge) {
            window.NixonLayout.updateCartBadge();
          }
          showToast('✓ Added to harvest bag');
        }
      };

      function showToast(message) {
        let container = document.getElementById('toast-container');
        if (!container) {
          container = document.createElement('div');
          container.id = 'toast-container';
          container.className = 'fixed bottom-8 right-8 z-50 flex flex-col gap-3 pointer-events-none';
          document.body.appendChild(container);
        }
        
        const toast = document.createElement('div');
        toast.className = 'market-toast pointer-events-auto transform translate-y-4 opacity-0 transition-all duration-300';
        toast.textContent = message;
        container.appendChild(toast);
        
        requestAnimationFrame(() => toast.classList.remove('translate-y-4', 'opacity-0'));
        setTimeout(() => {
          toast.classList.add('translate-y-4', 'opacity-0');
          setTimeout(() => toast.remove(), 400);
        }, 2500);
      }
    });
  </script>

</body>
</html>
