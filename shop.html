<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="assets/images/grossary-logo.png">
  <title>Artisanal Harvest — FreshCart Marketplace</title>
  <script>
  (function() {
    const savedTheme = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    const savedDir = localStorage.getItem('dir') || 'ltr';
    document.documentElement.setAttribute('dir', savedDir);
    
    // Disable page animation on shop
    document.documentElement.style.animation = 'none';
  })();
</script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'sage-accent': '#6A8071',
            'sage-dark': '#24302A',
            'cream-bg': '#F7F6F2',
          }
        }
      }
    }
  </script>
  
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* ============================================
       COMPLETE SHOP PAGE STYLES
       ============================================ */
    
    /* CRITICAL: Disable all page animations */
    html, body {
      animation: none !important;
      transform: none !important;
      opacity: 1 !important;
      filter: none !important;
      perspective: none !important;
    }
    
    body {
      animation: none !important;
      transform: none !important;
      opacity: 1 !important;
      filter: none !important;
      overflow-x: hidden;
    }
    
    body.cinematic-exit {
      display: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    
    /* ============================================
       ZIGZAG PRODUCT DISPLAY
       ============================================ */
    .zigzag-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    
    .zigzag-item {
      display: flex;
      align-items: center;
      gap: 60px;
      padding: 60px 0;
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      opacity: 0;
      transform: translateY(60px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .dark .zigzag-item {
      border-bottom-color: rgba(255, 255, 255, 0.06);
    }
    
    .zigzag-item.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .zigzag-item:nth-child(even) {
      flex-direction: row-reverse;
    }
    
    .zigzag-item:last-child {
      border-bottom: none;
    }
    
    .zigzag-image {
      flex: 0 0 45%;
      aspect-ratio: 4/3;
      overflow: hidden;
      position: relative;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
    }
    
    .dark .zigzag-image {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }
    
    .zigzag-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .zigzag-item:hover .zigzag-image img {
      transform: scale(1.05);
    }
    
    .zigzag-image .badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: #6A8071;
      color: #FFFFFF;
      font-size: 0.55rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 6px 16px;
      z-index: 10;
    }
    
    .zigzag-image .price-tag {
      position: absolute;
      bottom: 16px;
      right: 16px;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      color: #FFFFFF;
      font-weight: 800;
      font-size: 1.4rem;
      padding: 8px 20px;
      z-index: 10;
    }
    
    .dark .zigzag-image .price-tag {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
    }
    
    .zigzag-image .price-tag .old {
      font-size: 0.7rem;
      text-decoration: line-through;
      opacity: 0.5;
      font-weight: 400;
      margin-right: 8px;
    }
    
    .zigzag-content {
      flex: 1;
      padding: 20px 0;
    }
    
    .zigzag-content .category {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: #6A8071;
      display: inline-block;
      margin-bottom: 8px;
    }
    
    .zigzag-content h2 {
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      font-size: 1.8rem;
      line-height: 1.1;
      margin-bottom: 12px;
    }
    
    .dark .zigzag-content h2 {
      color: #FFFFFF;
    }
    
    .zigzag-content .description {
      font-size: 0.95rem;
      line-height: 1.8;
      color: #64748B;
      margin-bottom: 20px;
      max-width: 90%;
    }
    
    .dark .zigzag-content .description {
      color: #94A3B8;
    }
    
    .zigzag-content .origin {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #94A3B8;
      margin-bottom: 16px;
    }
    
    .zigzag-content .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    
    .btn-primary {
      display: inline-block;
      padding: 14px 32px;
      background: #6A8071;
      color: #FFFFFF;
      text-transform: uppercase;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      border: none;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      text-align: center;
    }
    
    .btn-primary:hover {
      background: #576B5D;
      transform: scale(1.02);
    }
    
    .btn-secondary {
      display: inline-block;
      padding: 14px 32px;
      background: transparent;
      color: #0F172A;
      text-transform: uppercase;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      border: 1px solid #0F172A;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      text-align: center;
    }
    
    .dark .btn-secondary {
      color: #FFFFFF;
      border-color: #FFFFFF;
    }
    
    .btn-secondary:hover {
      background: #6A8071;
      color: #FFFFFF;
      border-color: #6A8071;
      transform: scale(1.02);
    }
    
    /* Stats Section */
    .stats-section {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
      padding: 60px 20px;
      border-top: 1px solid rgba(0, 0, 0, 0.06);
      border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      margin: 40px 0;
    }
    
    .dark .stats-section {
      border-color: rgba(255, 255, 255, 0.06);
    }
    
    .stat-item {
      text-align: center;
    }
    
    .stat-item .number {
      font-weight: 800;
      font-size: 2.5rem;
      color: #6A8071;
      display: block;
    }
    
    .stat-item .label {
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #94A3B8;
      margin-top: 4px;
    }
    
    /* Responsive */
    @media (max-width: 1024px) {
      .zigzag-item {
        gap: 40px;
        padding: 50px 0;
      }
      .zigzag-content h2 {
        font-size: 1.5rem;
      }
    }
    
    @media (max-width: 768px) {
      .zigzag-container {
        padding: 20px 16px;
      }
      
      .zigzag-item {
        flex-direction: column !important;
        gap: 24px;
        padding: 40px 0;
      }
      
      .zigzag-image {
        flex: 0 0 100%;
        width: 100%;
        aspect-ratio: 4/3;
      }
      
      .zigzag-content {
        width: 100%;
        padding: 0;
      }
      
      .zigzag-content .description {
        max-width: 100%;
      }
      
      .zigzag-content h2 {
        font-size: 1.3rem;
      }
      
      .stats-section {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
        padding: 40px 16px;
      }
      
      .stat-item .number {
        font-size: 2rem;
      }
    }
    
    @media (max-width: 480px) {
      .zigzag-item {
        padding: 30px 0;
        gap: 16px;
      }
      
      .zigzag-content h2 {
        font-size: 1.1rem;
      }
      
      .zigzag-content .description {
        font-size: 0.85rem;
      }
      
      .btn-primary,
      .btn-secondary {
        padding: 10px 20px;
        font-size: 0.55rem;
        width: 100%;
        text-align: center;
      }
      
      .zigzag-content .actions {
        flex-direction: column;
      }
      
      .stats-section {
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 30px 12px;
      }
      
      .stat-item .number {
        font-size: 1.6rem;
      }
    }
    
    /* Section Header */
    .section-header {
      text-align: center;
      padding: 40px 20px 20px;
    }
    
    .section-header .subtitle {
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: #6A8071;
      font-weight: 700;
    }
    
    .section-header h1 {
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      font-size: 3rem;
      line-height: 1.05;
      margin-top: 8px;
    }
    
    .dark .section-header h1 {
      color: #FFFFFF;
    }
    
    .section-header .divider {
      width: 60px;
      height: 3px;
      background: #6A8071;
      margin: 16px auto;
    }
    
    .section-header p {
      color: #64748B;
      max-width: 500px;
      margin: 0 auto;
      font-size: 0.95rem;
    }
    
    .dark .section-header p {
      color: #94A3B8;
    }
    
    @media (max-width: 768px) {
      .section-header h1 {
        font-size: 2rem;
      }
    }
    
    @media (max-width: 480px) {
      .section-header h1 {
        font-size: 1.6rem;
      }
    }

    .market-toast {
      background: #24302A;
      color: #FFFFFF;
      padding: 14px 24px;
      border-radius: 0px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      border-left: 4px solid #6A8071;
    }
  </style>
</head>
<body>

  <main style="padding-top: 70px;">

    <!-- SECTION HEADER -->
    <div class="section-header">
      <p class="subtitle">🌿 Botanical Archive</p>
      <h1>Artisanal Harvest Collection</h1>
      <div class="divider"></div>
      <p>Explore our curated selection of premium organic provisions from around the world</p>
    </div>

    <!-- STATS SECTION -->
    <div class="stats-section">
      <div class="stat-item">
        <span class="number">140+</span>
        <span class="label">Farm Partners</span>
      </div>
      <div class="stat-item">
        <span class="number">450K</span>
        <span class="label">Daily Dispatches</span>
      </div>
      <div class="stat-item">
        <span class="number">73</span>
        <span class="label">Micro-Hubs</span>
      </div>
      <div class="stat-item">
        <span class="number">100%</span>
        <span class="label">Carbon Neutral</span>
      </div>
    </div>

    <!-- ZIGZAG PRODUCTS -->
    <div class="zigzag-container" id="productsContainer">
      <!-- Products injected by JavaScript -->
    </div>

  </main>

  <script src="js/db.js"></script>
  <script src="js/layout.js"></script>

  <script>
    (function() {
      'use strict';
      
      // Disable all animations on body
      document.body.style.animation = 'none';
      document.body.style.transform = 'none';
      document.body.style.opacity = '1';
      document.body.style.filter = 'none';
      
      var container = document.getElementById('productsContainer');
      
      if (!container) {
        console.error('Products container not found');
        return;
      }

      // Wait for products to load
      function checkAndInit() {
        if (window.FreshCartDB && window.FreshCartDB.products && window.FreshCartDB.products.length > 0) {
          renderProducts(window.FreshCartDB.products);
          return;
        }
        setTimeout(checkAndInit, 100);
      }

      function renderProducts(products) {
        var html = '';
        
        for (var i = 0; i < products.length; i++) {
          var p = products[i];
          var price = typeof p.price === 'number' ? p.price.toFixed(2) : '0.00';
          var oldPrice = p.oldPrice ? p.oldPrice.toFixed(2) : null;
          var badge = p.badge || 'Organic';
          var name = p.name || 'Product';
          var description = p.description || '';
          var image = p.image || '';
          var category = p.category || 'produce';
          var origin = p.origin || 'Direct Farm';
          var isEven = i % 2 === 1;
          
          var oldPriceHtml = oldPrice ? '<span class="old">$' + oldPrice + '</span>' : '';
          
          html += '<div class="zigzag-item" data-index="' + i + '">';
          html += '  <div class="zigzag-image">';
          html += '    <span class="badge">' + badge + '</span>';
          html += '    <img src="' + image + '" alt="' + name + '" loading="lazy">';
          html += '    <div class="price-tag">' + oldPriceHtml + '$' + price + '</div>';
          html += '  </div>';
          html += '  <div class="zigzag-content">';
          html += '    <span class="category">' + category + '</span>';
          html += '    <h2>' + name + '</h2>';
          html += '    <p class="description">' + description + '</p>';
          html += '    <p class="origin">🌍 Sourced from ' + origin + '</p>';
          html += '    <div class="actions">';
          html += '      <a href="product-detail.html?id=' + p.id + '" class="btn-secondary">View Details</a>';
          html += '      <button onclick="handleAddToCart(\'' + p.id + '\')" class="btn-primary">Add to Bag</button>';
          html += '    </div>';
          html += '  </div>';
          html += '</div>';
        }
        
        container.innerHTML = html;

        // Trigger scroll reveal animation
        var items = container.querySelectorAll('.zigzag-item');
        
        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
            }
          });
        }, {
          threshold: 0.15,
          rootMargin: '0px 0px -50px 0px'
        });
        
        items.forEach(function(item, index) {
          // Stagger the animation
          setTimeout(function() {
            observer.observe(item);
          }, index * 100);
        });

        console.log('Rendered', products.length, 'products in zigzag layout');
      }

      // Start checking for products
      checkAndInit();

      // ============================================
      // ADD TO CART HANDLER
      // ============================================
      window.handleAddToCart = function(productId) {
        if (window.FreshCartDB) {
          window.FreshCartDB.addToCart(productId);
          if (window.NixonLayout && window.NixonLayout.updateCartBadge) {
            window.NixonLayout.updateCartBadge();
          }
          showToast('✓ Added to harvest bag');
        }
      };

      // ============================================
      // TOAST NOTIFICATION
      // ============================================
      function showToast(message) {
        var container = document.getElementById('toast-container');
        if (!container) {
          container = document.createElement('div');
          container.id = 'toast-container';
          container.className = 'fixed bottom-8 right-8 z-50 flex flex-col gap-3 pointer-events-none';
          document.body.appendChild(container);
        }
        
        var toast = document.createElement('div');
        toast.className = 'market-toast pointer-events-auto transform translate-y-4 opacity-0 transition-all duration-300';
        toast.textContent = message;
        container.appendChild(toast);
        
        requestAnimationFrame(function() {
          toast.classList.remove('translate-y-4', 'opacity-0');
        });
        
        setTimeout(function() {
          toast.classList.add('translate-y-4', 'opacity-0');
          setTimeout(function() { toast.remove(); }, 400);
        }, 2500);
      }
    })();
  </script>

</body>
</html>
